<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Contas a Receber">
<meta name="theme-color" content="#16191E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}.ac-res{padding:18px;display:grid;gap:10px;background:var(--surface)}
.ac-big{font-size:22px;font-weight:600;line-height:1.25}.ac-big b{color:var(--ok)}
.ac-socios{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;font-size:13px}
.ac-socios>div{display:grid;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.rowpg .pg-sub .pill{font-size:11px;padding:1px 7px} .ac-socios .ok{color:var(--ok)} .ac-socios .crit{color:var(--crit)} .rowpg-main .v.ok{color:var(--ok)} .rowpg-main .v.crit{color:var(--crit)}
@media (max-width:560px){.ac-socios{grid-template-columns:1fr}.ac-big{font-size:19px}}
.ac-dash{margin-bottom:4px;padding:16px 18px;display:grid;gap:8px;cursor:pointer;border:2px solid var(--ok)!important;background:var(--ok-soft)}
.ac-dash:hover{filter:brightness(.98)} .ac-dash-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.combo{position:relative}
.combo-list{margin-top:4px;max-height:220px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:4px}
.combo-op{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:14px}
.combo-op:hover,.combo-op:focus-visible{background:var(--sunk)} .combo-op small{color:var(--muted);font-size:11px;white-space:nowrap}
.combo-novo{color:var(--accent);font-weight:600} .combo-h{padding:8px 10px;font-size:12px;color:var(--muted)}
.lbl-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.novo-nome{all:unset;cursor:pointer;color:var(--accent);font-size:12.5px;font-weight:600;padding:2px 0}
.nn-box{margin-top:6px;padding:10px;border:1px dashed var(--accent);border-radius:8px;display:grid;gap:8px;background:var(--surface)}
.nn-lados{display:flex;flex-wrap:wrap;gap:6px} .nn-lados .chip{cursor:pointer;font-size:12px;padding:4px 10px}
.ac-recs .chip{font-size:15px;padding:9px 22px;font-weight:600}
.ac-recs .chip.off{opacity:.35;pointer-events:none;text-decoration:line-through}
.only-mob{display:none}
@media (max-width:860px){.only-mob{display:grid!important}.only-desk{display:none!important}}
.dash-cards{gap:10px;margin-bottom:6px}
.dcard{all:unset;box-sizing:border-box;display:grid;gap:4px;width:100%;padding:14px 16px;border-radius:12px;color:#fff;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.dcard.cc{background:var(--ok-soft);color:var(--ink);border:2px solid var(--ok)} .dcard.cc .dcard-t{color:var(--ok)} .dcard.cc b{color:var(--ok)}
.dcard.pj{background:var(--pj)} .dcard.pf{background:var(--pf)}
.dcard.on{border-bottom-left-radius:0;border-bottom-right-radius:0}
.dcard-t{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.dcard-chev{font-size:16px;line-height:1}
.dcard-v{font-size:18px;font-weight:600;line-height:1.25} .dcard-v b{font-size:22px}
.dcard-s{font-size:12.5px;opacity:.9}
.dcard-det{border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;padding:10px;margin-top:-10px;background:var(--surface)}
.dcard-det .dcol-h{display:none}
:root[data-theme="dark"] .dcard.pj,:root[data-theme="dark"] .dcard.pf{color:#0f1312}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dcard.pj,:root:not([data-theme="light"]) .dcard.pf{color:#0f1312}}
.eco-ciclo .pill{margin-left:4px}
.eco-tot{background:var(--sunk);font-weight:600;cursor:default} .eco-tot:hover{background:var(--sunk)}
.eco-acts{padding:8px 14px;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line)} .eco-acts .right{margin-left:auto}
.eco-linha{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:6px}
.eco-linha.alerta{border-color:var(--crit);background:var(--crit-soft)}
.eco-nome{display:flex;justify-content:space-between;align-items:baseline;gap:8px} .eco-liq{font-size:13px;color:var(--ok)}
.eco-ins{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ei-cols{grid-template-columns:repeat(2,minmax(0,1fr))!important}
.ei-sel{grid-template-columns:minmax(0,1fr) auto!important;gap:8px;cursor:default} .ei-sel:hover{background:none} .ei-sel select{width:auto;max-width:150px}
@media (max-width:560px){.ei-cols{grid-template-columns:1fr!important}}
.eco-cfg-l{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:6px;margin-bottom:6px}
.eco-gest{padding:8px 14px;border-top:1px solid var(--line);display:grid;gap:4px} .eco-gl{display:flex;justify-content:space-between;gap:8px;font-size:14px}
</style>
<title>Gestão de Contas a Receber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: livro-razão — barra lateral fixa (desktop) / barra inferior (celular), conteúdo em folhas sobre papel acinzentado */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --sunk:#E6EAF0; --ink:#111827; --muted:#5B6474; --line:#D5DBE4;
  --accent:#1F2937; --accent-ink:#FFFFFF; --accent-soft:#ECEEF1;
  --ok:#1B7448; --ok-soft:#E1F1E7; --warn:#A5620A; --warn-soft:#F7ECDA; --crit:#C2410C; --crit-soft:#FDEBDD;
  --legal:#475569; --legal-soft:#E8ECF1; --shadow:0 1px 2px rgba(20,30,25,.06),0 4px 16px rgba(20,30,25,.05);
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --pf:#1D4ED8; --pf-soft:#E3EAFD; --pj:#B91C1C; --pj-soft:#FBE5E5; --gold:#C8963E;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1312; --surface:#161B1A; --sunk:#1D2321; --ink:#E5EAE6; --muted:#97A39C; --line:#2A3230;
  --accent:#E5E7EB; --accent-ink:#111418; --accent-soft:#262A31;
  --ok:#5BC38B; --ok-soft:#173226; --warn:#E2A74E; --warn-soft:#382A14; --crit:#FB923C; --crit-soft:#3A2414;
  --legal:#B99CE8; --legal-soft:#2C2240; --pf:#7AA2FF; --pf-soft:#17213D; --pj:#F87171; --pj-soft:#3A1616; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1312; --surface:#161B1A; --sunk:#1D2321; --ink:#E5EAE6; --muted:#97A39C; --line:#2A3230;
  --accent:#E5E7EB; --accent-ink:#111418; --accent-soft:#262A31;
  --ok:#5BC38B; --ok-soft:#173226; --warn:#E2A74E; --warn-soft:#382A14; --crit:#FB923C; --crit-soft:#3A2414;
  --legal:#B99CE8; --legal-soft:#2C2240; --pf:#7AA2FF; --pf-soft:#17213D; --pj:#F87171; --pj-soft:#3A1616; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.m,.money{font-family:var(--f-num);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---- casca ---- */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 12px;gap:4px;overflow:auto}
.brand{padding:4px 10px 18px;display:flex;flex-direction:column;gap:2px}
.brand b{font-weight:800;font-size:17px;letter-spacing:-.01em;line-height:1.2}
.brand span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.nav-btn[data-v=acertos]{color:var(--ok)!important;font-weight:700}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500;text-align:left}
.nav-btn svg{width:18px;height:18px;flex:none}
.nav-btn:hover{background:var(--sunk);color:var(--ink)}
.nav-btn.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav-btn .ct{margin-left:auto;font:600 11px var(--f-num);background:var(--crit-soft);color:var(--crit);padding:1px 6px;border-radius:99px}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:10px}
.main{min-width:0;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.tabbar{display:none}

@media (min-width:861px){.main{padding-left:32px;padding-right:max(32px,env(safe-area-inset-right,0px))}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  :root{padding-bottom:0!important}
  html,body{height:100%;overflow:hidden}
  .app{height:100%;display:flex;flex-direction:column;min-height:0}
  .main{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:24px;padding-top:16px}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:relative;flex:none;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;white-space:nowrap;color:var(--muted);padding:4px 0;cursor:pointer}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button.on{color:var(--accent);font-weight:700}
  .tabbar [data-v=acertos]{color:var(--ok);font-weight:700}
  .tabbar .plus span.ic{background:var(--accent);color:var(--accent-ink);border-radius:12px;width:44px;height:30px;display:grid;place-items:center}
}

/* ---- cabeçalho de página ---- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
.ph .sub{color:var(--muted);font-size:14px;margin-top:4px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ---- carteiras ---- */
.carteiras{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--muted);font-weight:500}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}

/* ---- botões ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}

/* ---- indicadores ---- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.kpi .v{font:600 21px/1.2 var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em;overflow-wrap:anywhere}
.kpi .h{font-size:12px;color:var(--muted)}
.kpi.lead{background:var(--accent);color:var(--accent-ink)}
.kpi.lead .l,.kpi.lead .h{color:inherit;opacity:.8}
.kpi .v.crit{color:var(--crit)} .kpi .v.ok{color:var(--ok)} .kpi .v.legal{color:var(--legal)}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important}.kpi .v{font-size:17px}}

/* ---- folhas ---- */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.sheet>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sheet>header h2{margin:0;font-size:15px;font-weight:700}
.sheet>header .meta{font-size:13px;color:var(--muted)}
.sheet .body{padding:16px 18px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:860px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}

/* ---- tabelas ---- */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th.r,td.r,td.m{text-align:right;white-space:nowrap}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunk)}
tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
td .s{display:block;font-size:12px;color:var(--muted)}
.ledger td.m.deb{color:var(--ink)} .ledger td.m.cred{color:var(--ok)}
.ledger td.m.sal{font-weight:600}
.ledger tr.t-juros td,.ledger tr.t-multa td,.ledger tr.t-ajuste td{color:var(--muted)}
.ledger tr.t-juros td.sal,.ledger tr.t-multa td.sal{color:var(--ink)}
.dc{font:600 10px var(--f-num);padding:1px 4px;border-radius:3px;margin-left:4px;vertical-align:1px}
.dc.d{background:var(--sunk);color:var(--muted)} .dc.c{background:var(--ok-soft);color:var(--ok)}

/* ---- pílulas ---- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.legal{background:var(--legal-soft);color:var(--legal)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);text-transform:uppercase;white-space:nowrap}
.tag.pf{color:var(--pf);background:var(--pf-soft);border-color:transparent}
.tag.pj{color:var(--pj);background:var(--pj-soft);border-color:transparent}
.chip.pf::before,.chip.pj::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}
.chip.pf::before{background:var(--pf)} .chip.pj::before{background:var(--pj)}
.kpi.pf{box-shadow:inset 0 3px 0 var(--pf)} .kpi.pf .v{color:var(--pf)}
.kpi.pj{box-shadow:inset 0 3px 0 var(--pj)} .kpi.pj .v{color:var(--pj)}
.kpi.pfs{box-shadow:inset 0 3px 0 var(--pf)} .kpi.pjs{box-shadow:inset 0 3px 0 var(--pj)}
.kpi.span-all{grid-column:1/-1}
.stamp{display:inline-block;font:700 11px var(--f-num);letter-spacing:.14em;color:var(--legal);border:1.5px solid var(--legal);padding:2px 6px;border-radius:3px;transform:rotate(-2deg)}

/* ---- listas ---- */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.row:last-child{border-bottom:0}
.row.compact{padding:8px 18px;gap:10px}
.row.compact .t{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.row.compact .v{font-size:14px}
.row.compact .sm{font-size:12px;font-weight:500}
.rowpg{cursor:default;grid-template-columns:minmax(0,1fr) auto;padding-right:8px}
.rowpg:hover{background:none}
.rowpg-main{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;cursor:pointer;min-width:0;border-radius:6px}
.rowpg-main:hover .t{color:var(--accent)}
.rowpg-main:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rowpg-acts{display:flex;gap:2px}
.rowpg-acts .btn{padding:5px 7px}
.autor{font-size:12px;color:var(--muted);font-style:italic}
.cat-list{display:flex;flex-direction:column;gap:12px}
.cat-top{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.cat-n{font-weight:600;min-width:0;overflow-wrap:anywhere}
.cat-v{font-weight:600;white-space:nowrap}
.cat-v small{font:500 11px var(--f-ui);color:var(--muted);margin-left:6px}
.cat-row .bar{height:7px;margin-top:4px}
.cat-s{font-size:11px;color:var(--muted);margin-top:3px}
.dash2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.dash2{grid-template-columns:minmax(0,1fr)}.dash2>.dcol.pj{order:-1}}
.dcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.dcol-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 14px;border-radius:10px;color:#fff;font-weight:700;font-size:14px}
.dcol-h b{font-size:20px;font-weight:600}
.dcol.pf .dcol-h{background:var(--pf)} .dcol.pj .dcol-h{background:var(--pj)}
:root[data-theme="dark"] .dcol-h{color:#0f1312}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dcol-h{color:#0f1312}}
.dcol .kpi{padding:10px 12px;gap:2px}
.dcol .kpi .l{font-size:11px} .dcol .kpi .v{font-size:16px} .dcol .kpi .h{font-size:11px}
.dcol .sheet>header{padding:9px 12px} .dcol .sheet>header h2{font-size:13px} .dcol .sheet>header .meta{font-size:12px}
.dcol .row.compact{padding:6px 12px} .dcol .row.compact .t{font-size:13px;gap:6px} .dcol .row.compact .v{font-size:13px}
.dcol .row .v small{font-size:11px}
.dcol .empty{padding:14px 12px;font-size:13px}
.dcol .rowpg-main .t{font-size:13px}
.dash-switch{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--sunk);padding:5px;border-radius:12px}
.dash-switch button{border:0;border-radius:9px;padding:11px 8px;font-weight:700;font-size:15px;cursor:pointer;background:none;color:var(--muted)}
.dash-switch button.pf.on{background:var(--pf);color:#fff}

<script>
/* ===== MOTOR FINANCEIRO — todos os valores em centavos (inteiros) ===== */
const Eng = (() => {
  const DAY = 86400000;
  const dn = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d) / DAY; };
  const fromDn = n => new Date(n * DAY).toISOString().slice(0, 10);
  const addDays = (s, k) => fromDn(dn(s) + k);
  const addMonths = (s, k) => {
    const [y, m, d] = s.split('-').map(Number);
    const t = new Date(Date.UTC(y, m - 1 + k, 1));
    const last = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate();
    t.setUTCDate(Math.min(d, last));
    return t.toISOString().slice(0, 10);
  };
  const diff = (a, b) => dn(b) - dn(a);

  /** Gera o cronograma de parcelas: valor dividido em centavos exatos, resto nas primeiras. */
  function gerarCronograma(valor, n, primeiroVenc) {
    n = Math.max(1, Math.floor(n || 1));
    const base = Math.floor(valor / n), resto = valor - base * n;
    return Array.from({ length: n }, (_, i) => ({ n: i + 1, venc: addMonths(primeiroVenc, i), valor: base + (i < resto ? 1 : 0) }));
  }

  /**
   * Calcula a posição de uma dívida em uma data.
   * pags: [{id,data,valor,tipo:'recebimento'|'renegociacao'|'abatimento',criadoEm}]
   * ajs:  [{id,data,valor(+/-),tipo:'juros'|'multa',justificativa}]
   */
  function calcular(d, pags = [], ajs = [], asOf) {
    const V = d.valor;
    const cron = (d.cronograma && d.cronograma.length) ? d.cronograma : gerarCronograma(V, d.parcelas || 1, d.vencimento);
    const parcelas = cron.map(p => ({ n: p.n, venc: p.venc, valor: p.valor, pago: 0, quitadaEm: null }));
    let P = V, J = 0, M = 0;
    let jurosTot = 0, multaTot = 0, ajJuros = 0, ajMulta = 0, recebido = 0, outrasBaixas = 0, excedente = 0;
    const amort = d.amortizacao === 'principal_primeiro' ? 'principal_primeiro' : 'juros_primeiro';
    const j = d.juros && d.juros.ativo && d.juros.taxa > 0 ? d.juros : null;
    const multaPct = d.multa && d.multa.ativo ? (+d.multa.pct || 0) : 0;
    const jIni = j ? (j.inicio || d.dataOperacao) : null;
    let last = jIni;
    const ledger = [{ data: d.dataOperacao, tipo: 'principal', desc: d.descricao || 'Dívida', debito: V, credito: 0 }];

    const accrue = to => {
      if (!j || to < jIni) return;
      if (last < jIni) last = jIni;
      const days = diff(last, to);
      if (days <= 0) return;
      const per = j.periodo === 'ano' ? 365 : 30, i = j.taxa / 100;
      const comp = j.tipo === 'composto';
      const base = comp ? P + J : P;
      const raw = comp ? base * (Math.pow(1 + i, days / per) - 1) : base * i * days / per;
      const a = Math.round(raw);
      if (a > 0) {
        J += a; jurosTot += a;
        ledger.push({ data: to, tipo: 'juros', desc: `Juros ${comp ? 'compostos' : 'simples'} · ${days} dia${days > 1 ? 's' : ''}`, debito: a, credito: 0 });
      }
      last = to;
    };
    const payPrincipal = v => {
      const use = Math.min(v, P);
      let rest = use;
      for (const p of parcelas) {
        if (rest <= 0) break;
        const open = p.valor - p.pago;
        if (open <= 0) continue;
        const t = Math.min(open, rest);
        p.pago += t; rest -= t;
      }
      P -= use;
      return use;
    };

    const ev = [];
    for (const p of parcelas) if (multaPct > 0) ev.push({ data: addDays(p.venc, 1), ord: 0, k: 'multa', p });
    for (const a of ajs) ev.push({ data: a.data, ord: 1, k: 'ajuste', a, c: a.criadoEm || '' });
    for (const g of pags) ev.push({ data: g.data, ord: 2, k: 'pag', g, c: g.criadoEm || '' });
    ev.sort((x, y) => x.data < y.data ? -1 : x.data > y.data ? 1 : x.ord - y.ord || (x.c < y.c ? -1 : x.c > y.c ? 1 : 0));

    for (const e of ev) {
      if (e.data > asOf) continue;
      accrue(e.data);
      if (e.k === 'multa') {
        const unpaid = e.p.valor - e.p.pago;
        if (unpaid > 0) {
          const m = Math.round(unpaid * multaPct / 100);
          if (m > 0) { M += m; multaTot += m; ledger.push({ data: e.data, tipo: 'multa', desc: `Multa ${fmtPct(multaPct)} · parcela ${e.p.n} em atraso`, debito: m, credito: 0 }); }
        }
      } else if (e.k === 'ajuste') {
        const a = e.a;
        if (a.tipo === 'multa') {
          const v = Math.max(a.valor, -M); M += v; ajMulta += v; multaTot += v;
          ledger.push({ data: a.data, tipo: 'ajuste', desc: `Ajuste de multa · ${a.justificativa || ''}`, debito: v > 0 ? v : 0, credito: v < 0 ? -v : 0 });
        } else {
          const v = Math.max(a.valor, -J); J += v; ajJuros += v; jurosTot += v;
          ledger.push({ data: a.data, tipo: 'ajuste', desc: `Ajuste de juros · ${a.justificativa || ''}`, debito: v > 0 ? v : 0, credito: v < 0 ? -v : 0 });
        }
      } else {
        const g = e.g; let v = g.valor; const parts = { multa: 0, juros: 0, principal: 0 };
        const takeM = () => { const t = Math.min(v, M); M -= t; v -= t; parts.multa += t; };
        const takeJ = () => { const t = Math.min(v, J); J -= t; v -= t; parts.juros += t; };
        const takeP = () => { const t = payPrincipal(v); v -= t; parts.principal += t; };
        if (amort === 'principal_primeiro') { takeP(); takeM(); takeJ(); } else { takeM(); takeJ(); takeP(); }
        excedente += v;
        for (const p of parcelas) if (!p.quitadaEm && p.pago >= p.valor) p.quitadaEm = g.data;
        if (g.tipo === 'recebimento') recebido += g.valor; else outrasBaixas += g.valor;
        const rot = g.tipo === 'renegociacao' ? 'Baixa por renegociação' : g.tipo === 'abatimento' ? 'Abatimento / desconto concedido' : 'Pagamento recebido';
        ledger.push({ data: g.data, tipo: g.tipo, desc: rot + (g.forma ? ` · ${g.forma}` : ''), debito: 0, credito: g.valor, parts, pagId: g.id });
      }
    }
    if (asOf >= d.dataOperacao) accrue(asOf);

    const saldo = P + J + M;
    const vencidas = parcelas.filter(p => p.venc < asOf && p.pago < p.valor);
    const principalVencido = vencidas.reduce((s, p) => s + (p.valor - p.pago), 0);
    const vencido = vencidas.length ? principalVencido + J + M : 0;
    const proxima = parcelas.find(p => p.pago < p.valor) || null;
    const temReneg = pags.some(g => g.tipo === 'renegociacao' && g.data <= asOf);
    let situacao;
    if (d.cancelada) situacao = 'cancelada';
    else if (saldo <= 0 && temReneg) situacao = 'renegociada';
    else if (saldo <= 0) situacao = 'quitada';
    else if (vencidas.length) situacao = 'vencida';
    else if (recebido > 0 || outrasBaixas > 0) situacao = 'parcial';
    else situacao = 'emdia';
    for (const p of parcelas) p.status = p.pago >= p.valor ? 'paga' : p.venc < asOf ? 'vencida' : p.pago > 0 ? 'parcial' : 'aberta';

    return {
      principalOriginal: V, principalAberto: P, jurosAcumulados: jurosTot, jurosAberto: J,
      multas: multaTot, multaAberta: M, ajustesJuros: ajJuros, ajustesMulta: ajMulta,
      totalAtualizado: V + jurosTot + multaTot, recebido, outrasBaixas, excedente, saldo,
      vencido, aVencer: saldo - vencido, parcelas, proxima, situacao, ledger,
      diasAtraso: vencidas.length ? diff(vencidas[0].venc, asOf) : 0
    };
  }
  function fmtPct(p) { return String(p).replace('.', ',') + '%'; }

  return { calcular, gerarCronograma, addDays, addMonths, diff, dn };
})();

/* conta corrente de um devedor com um credor */
function contaCorrente(devId, credId, ate) {
  const ds = S.dividas.filter(d => d.devedorId === devId && d.credorId === credId && !d.cancelada && !X.futRec.has(d.id));
  const ORD = { principal: 0, juros: 1, multa: 2, ajuste: 3 };
  const rows = [];
  let seq = 0;
  for (const d of ds) for (const l of X.C[d.id].ledger) rows.push({ ...l, d, ord: ORD[l.tipo] ?? 4, seq: seq++ });
  rows.sort((a, b) => a.data < b.data ? -1 : a.data > b.data ? 1 : a.ord - b.ord || a.seq - b.seq);
  let s = 0;
  const out = [];
  for (const r of rows) { s += r.debito - r.credito; r.saldo = s; if (!ate || r.data <= ate) out.push(r); }
  return out;
}
function ledgerTable(rows, opts = {}) {
  if (!rows.length) return `<div class="empty">Nenhuma movimentação.</div>`;
  const deb = rows.reduce((s, r) => s + r.debito, 0), cred = rows.reduce((s, r) => s + r.credito, 0);
  return `<div class="tw"><table class="ledger"><thead><tr><th>Data</th><th>Descrição</th><th class="r">Débito</th><th class="r">Crédito</th><th class="r">Saldo</th></tr></thead><tbody>

    <td>${esc(r.tipo === 'principal' ? (r.d.descricao || (r.d.origemRenegociacao ? 'Renegociação' : 'Dívida')) : r.desc)}<span class="s">${esc(divNum(r.d))}${r.tipo === 'principal' ? (r.d.categoria ? ' · ' + esc(r.d.categoria) : '') + (r.d.criadoPor ? ' · por ' + esc(nomeUser(r.d.criadoPor)) : '') : ''}${r.pagId ? (g => g && g.criadoPor ? ' · por ' + esc(nomeUser(g.criadoPor)) : '')(S.pagamentos.find(p => p.id === r.pagId)) : ''}${r.parts && (r.parts.juros || r.parts.multa) ? ` · amortizou ${brl(r.parts.principal)} principal, ${brl(r.parts.juros)} juros${r.parts.multa ? ', ' + brl(r.parts.multa) + ' multa' : ''}` : ''}</span></td>
    <td class="m deb">${r.debito ? brl(r.debito) : '—'}</td><td class="m cred">${r.credito ? brl(r.credito) : '—'}</td>
    <td class="m sal">${brl(Math.abs(r.saldo))}<span class="dc ${r.saldo >= 0 ? 'd' : 'c'}">${r.saldo >= 0 ? 'D' : 'C'}</span></td></tr>`).join('')}
  </tbody><tfoot><tr><td></td><td>Totais</td><td class="m">${brl(deb)}</td><td class="m">${brl(cred)}</td><td class="m">${brl(deb - cred)}</td></tr></tfoot></table></div>`;
}

/* ================= DASHBOARD ÚNICO: PF e PJ lado a lado, sem somar ================= */
function colunaDash(TIPO) {
  const t = X.t, cl = TIPO === 'PF' ? 'pf' : 'pj';
  const ab = S.dividas.filter(d => !d.cancelada && (credOf(d).tipo === 'PF') === (TIPO === 'PF') && ativa(d));
  const sum = (a, fn) => a.reduce((s, x) => s + fn(x), 0);
  const saldo = sum(ab, d => X.C[d.id].saldo), venc = sum(ab, d => X.C[d.id].vencido);
  const nVenc = ab.filter(d => X.C[d.id].situacao === 'vencida').length;
  const prev = sum(ab.filter(prevista), d => X.C[d.id].saldo);
  const kp = (l, v, h, cls = '', extra = '') => `<div class="kpi ${extra}"><div class="l">${l}</div><div class="v ${cls}">${v}</div>${h ? `<div class="h">${h}</div>` : ''}</div>`;
  const lim30 = Eng.addDays(t, 30); let rec30 = 0, nRec30 = 0;
  for (const d of ab) for (const p of X.C[d.id].parcelas) if (p.pago < p.valor && p.venc !== SEM && p.venc >= t && p.venc <= lim30) { rec30 += p.valor - p.pago; nRec30++; }
  const receber30 = kp('A receber (30 dias)', brl(rec30), `${nRec30} vencimento${nRec30 !== 1 ? 's' : ''}`, '', TIPO === 'PJ' ? 'span-all' : '');
  let pag = '';
  if (TIPO === 'PF' && typeof pfCarteiras === 'function' && pfCarteiras().length) {
    const pfs = pfCarteiras(), lim = Eng.addDays(t, 30); let tot = 0, vp = 0, n = 0;
    for (const cp of S.contas_pagar) { if (cp.cancelada || !pfs.some(c => c.id === cp.credorId) || cp.vencimento > lim) continue; const p = posPagar(cp); if (p.saldo <= 0) continue; tot += p.saldo; n++; if (cp.vencimento < t) vp += p.saldo; }
    pag = kp('A pagar (30 dias)', brl(tot), vp ? `<span class="crit">${brl(vp)} vencido</span>` : `${n} conta${n !== 1 ? 's' : ''}`);
  }
  const devMap = {};
  for (const d of ab) {
    const x = (devMap[d.devedorId] ||= { saldo: 0, venc: 0, n: 0, creds: new Set() });
    const c = X.C[d.id]; x.saldo += c.saldo; x.venc += c.vencido; x.n++; x.creds.add(d.credorId);
    if (c.proxima && c.proxima.venc !== SEM && (!x.prox || c.proxima.venc < x.prox)) x.prox = c.proxima.venc;
    if (prevista(d)) x.prevVal = (x.prevVal || 0) + c.saldo;
    if (d.juridico && d.juridico.ativo) x.jur = true;
  }
  const quem = Object.entries(devMap).sort((a, b) => b[1].saldo - a[1].saldo);
  const multiEmp = TIPO === 'PJ' && new Set(ab.map(d => d.credorId)).size > 1;
  const quemHtml = quem.length ? quem.map(([id, x]) => `<div class="row compact rowpg"><button type="button" class="rowpg-main" data-act="go" data-v="devedor" data-id="${id}">
      <div class="t"><span class="dot ${x.venc ? 'crit' : ''}"></span>${esc((X.dev[id] || {}).nome || '—')}${x.prox ? `<span class="num sm ${x.prox < t ? 'crit' : 'muted'}">${ddmm(x.prox)}</span>` : ''}${multiEmp ? [...x.creds].map(c => `<span class="tag pj">${esc(credCurto(X.cred[c]))}</span>`).join('') : ''}${x.jur ? '<span class="tag" style="color:var(--legal)">JUR</span>' : ''}</div>
      <div class="v">${x.prevVal ? (x.prevVal >= x.saldo ? `<span class="prev-val">${brl(x.saldo)}</span><small class="prev-lbl">previsto</small>` : `${brl(x.saldo - x.prevVal)}<small class="prev-val">+ ${brl(x.prevVal)} previsto</small>`) : brl(x.saldo)}${x.venc ? `<small class="crit">venc. ${brl(x.venc)}</small>` : ''}</div></button>${S.canWrite ? `<span class="rowpg-acts"><button type="button" class="btn ghost sm ok-btn" data-act="receberDevTipo" data-id="${id}" data-t="${TIPO}" aria-label="Registrar recebimento" title="Registrar recebimento">${IC.check}</button></span>` : ''}</div>`).join('') : `<div class="empty">Ninguém com saldo em aberto.</div>`;
  const abertosPJ = [];
  if (TIPO === 'PJ') {
    for (const d of ab) for (const p of X.C[d.id].parcelas) if (p.pago < p.valor && p.venc !== SEM) abertosPJ.push({ d, p });
    abertosPJ.sort((a, b) => a.p.venc < b.p.venc ? -1 : a.p.venc > b.p.venc ? 1 : 0);
  }
  const prox = [];
  const lim = Eng.addDays(t, 30);
  for (const d of ab) for (const p of X.C[d.id].parcelas) if (p.pago < p.valor && p.venc !== SEM && p.venc >= t && p.venc <= lim) prox.push({ d, p });
  prox.sort((a, b) => a.p.venc < b.p.venc ? -1 : 1);
  return `<div class="dcol ${cl}">
    <div class="dcol-h"><span>${TIPO === 'PF' ? 'Pessoa física' : 'Pessoa jurídica'}</span><b class="num">${brl(saldo)}</b></div>
    <div class="kpis" style="grid-template-columns:repeat(2,minmax(0,1fr))">
      ${kp('Vencido', brl(venc), nVenc ? `${nVenc} em atraso` : 'Nada em atraso', venc ? 'crit' : '')}
      ${kp('A vencer', brl(saldo - venc), prev ? `${brl(prev)} previsto` : `${ab.length} dívida${ab.length !== 1 ? 's' : ''}`)}
      ${receber30}

function barrasCategoria(itens, cor, rotuloVazio) {
  if (!itens.length) return `<div class="empty">${rotuloVazio}</div>`;
  const max = Math.max(...itens.map(x => x.valor), 1);
  const tot = itens.reduce((s, x) => s + x.valor, 0);
  return `<div class="cat-list">${itens.map(x => `<div class="cat-row">
    <div class="cat-top"><span class="cat-n">${esc(x.nome)}</span><span class="num cat-v">${brl(x.valor)}<small>${tot ? Math.round(x.valor / tot * 100) : 0}%</small></span></div>
    <div class="bar"><i style="width:${Math.max(2, Math.round(x.valor / max * 100))}%;background:var(--${cor})"></i></div>
    ${x.sub ? `<div class="cat-s">${x.sub}</div>` : ''}</div>`).join('')}</div>`;
}
function catReceber(TIPO) {
  const g = {};
  for (const d of S.dividas) {
    if (d.cancelada || !ativa(d) || (credOf(d).tipo === 'PF') !== (TIPO === 'PF')) continue;
    const k = d.categoria || 'Sem categoria', c = X.C[d.id];
    const x = (g[k] ||= { nome: k, valor: 0, venc: 0, n: 0 }); x.valor += c.saldo; x.venc += c.vencido; x.n++;
  }
  return Object.values(g).sort((a, b) => b.valor - a.valor).map(x => ({ ...x, sub: `${x.n} dívida${x.n !== 1 ? 's' : ''}${x.venc ? ` · <span class="crit">vencido ${brl(x.venc)}</span>` : ''}` }));
}
function catPagar() {
  if (typeof pfCarteiras !== 'function') return [];
  const pfs = pfCarteiras(); const [m0, m1] = monthBounds(X.t); const g = {};
  for (const cp of S.contas_pagar) {
    if (cp.cancelada || !pfs.some(c => c.id === cp.credorId)) continue;
    const p = posPagar(cp); const k = cp.categoria || 'Sem categoria';
    const noMes = cp.vencimento >= m0 && cp.vencimento <= m1;
    let pagoMes = 0; for (const pg of (cp.pagamentos || [])) if (!pg.estornado && pg.data >= m0 && pg.data <= m1) pagoMes += pg.valor;
    if (!noMes && !pagoMes && !(p.st === 'vencida')) continue;
    const x = (g[k] ||= { nome: k, valor: 0, pago: 0, venc: 0 });
    if (noMes || p.st === 'vencida') x.valor += p.saldo;
    if (p.st === 'vencida') x.venc += p.saldo;
    x.pago += pagoMes;
  }
  return Object.values(g).filter(x => x.valor || x.pago).sort((a, b) => (b.valor + b.pago) - (a.valor + a.pago)).map(x => ({ ...x, sub: [x.pago ? `<span class="ok">pago no mês ${brl(x.pago)}</span>` : '', x.venc ? `<span class="crit">vencido ${brl(x.venc)}</span>` : ''].filter(Boolean).join(' · ') }));
}

  if (x.juros.ativo && x.juros.inicio && x.juros.inicio < x.dataOperacao) return 'O início dos juros não pode ser anterior à operação.';
  if (x.multa.ativo && !(x.multa.pct > 0 && x.multa.pct <= 100)) return 'Informe um percentual de multa válido.';
  return null;
}
AFTER.nova = () => {
  const f = $('#f-div'); if (!f) return;
  const prev = () => {
    const x = readDividaForm(f);
    $('#box-juros').hidden = !x.juros.ativo; $('#box-multa').hidden = !x.multa.ativo;
    ['#wrap-venc', '#wrap-parc', '#wrap-multa', '#wrap-rep'].forEach(s => { const e = $(s); if (e) e.hidden = x.livre; }); $('#hint-livre').hidden = !x.livre;
    const rp = f.elements.repete ? f.elements.repete.value : 'unico';
    if ($('#wrap-fim')) $('#wrap-fim').hidden = rp === 'unico';
    if ($('#wrap-parc')) $('#wrap-parc').hidden = x.livre || rp !== 'unico';
    const el = $('#nd-prev');
    if (x.livre) { el.innerHTML = ''; return; }
    if (!(x.valor > 0) || !x.vencimento) { el.innerHTML = ''; return; }
    const cr = Eng.gerarCronograma(x.valor, x.parcelas, x.vencimento);
    const show = cr.length > 6 ? [...cr.slice(0, 3), null, ...cr.slice(-2)] : cr;
    let simul = '';
    if (x.juros.ativo && x.juros.taxa > 0 && x.dataOperacao && x.vencimento >= x.dataOperacao) {
      const r = Eng.calcular({ ...x, cronograma: cr }, [], [], cr[cr.length - 1].venc);
      simul = `<div class="hint" style="margin-top:6px">Sem pagamentos, os juros até o último vencimento (${fd(cr[cr.length - 1].venc)}) somariam <b class="num">${brl(r.jurosAcumulados)}</b>.</div>`;
    }
    el.innerHTML = `<span class="lb">Cronograma</span><div class="tw"><table><thead><tr><th>Parcela</th><th>Vencimento</th><th class="r">Valor</th></tr></thead><tbody>${show.map(p => p ? `<tr><td>${p.n}/${cr.length}</td><td class="num">${fd(p.venc)}</td><td class="m">${brl(p.valor)}</td></tr>` : `<tr><td colspan="3" class="muted">…</td></tr>`).join('')}</tbody></table></div>${simul}`;
  };
  f.addEventListener('input', prev); f.addEventListener('change', prev); prev();
  f.addEventListener('submit', async e => {
    e.preventDefault();
    if (!needWrite()) return;
    const btn = f.querySelector('button[type=submit]'); if (btn.disabled) return;
    const ed = S.p.editId ? X.div[S.p.editId] : null;
    const x = readDividaForm(f);
    if (ed && (X.pagsBy[ed.id] || []).length) { x.credorId = ed.credorId; x.devedorId = ed.devedorId; }
    const err = validaDivida(x); if (err) { toast(err, true); return; }
    btn.disabled = true;
    try {
      const novos = await uploadFiles(f.elements.files.files, x.credorId);
      if (ed) {
        const mudouCron = ed.valor !== x.valor || (ed.parcelas || 1) !== x.parcelas || ed.vencimento !== x.vencimento;
        const doc = clean({ ...ed, ...x, numero: x.numero || ed.numero, cronograma: mudouCron ? Eng.gerarCronograma(x.valor, x.parcelas, x.vencimento) : ed.cronograma, anexos: [...(ed.anexos || []), ...novos] });
        const campos = ['confirmacao', 'credorId', 'devedorId', 'valor', 'dataOperacao', 'descricao', 'vencimento', 'parcelas', 'numero', 'categoria', 'formaPagamento', 'amortizacao', 'obs'];
        const diffs = campos.filter(k => String(ed[k] ?? '') !== String(doc[k] ?? '')).map(k => `${k}: ${k === 'valor' ? brl(ed[k]) : (ed[k] ?? '—')} → ${k === 'valor' ? brl(doc[k]) : (doc[k] ?? '—')}`);
        if (JSON.stringify(ed.juros || {}) !== JSON.stringify(x.juros)) diffs.push('condições de juros alteradas');
        if (JSON.stringify(ed.multa || {}) !== JSON.stringify(x.multa)) diffs.push('condições de multa alteradas');
        if (novos.length) diffs.push(`${novos.length} documento(s) anexado(s)`);
        await put('dividas', ed.id, stamp(doc, false));
        await audit('edição', 'divida', ed.id, diffs.length ? diffs.join('; ') : 'Dívida salva sem alterações', { antes: JSON.stringify(clean(ed)).slice(0, 6000) });
        S.dirty = false; toast('Dívida atualizada.'); go('divida', { id: ed.id });
      } else {
        const rp = !x.livre && f.elements.repete ? f.elements.repete.value : 'unico';
        if (rp !== 'unico') {
          const fim = f.elements.fimRep.value === 'sem' ? 'sem' : Math.max(2, parseInt(f.elements.fimRep.value) || 2);
          const grupo = newId('dividas'), numBase = x.numero || proxNumero();
          const recorrente = { freq: rp, fim, inicio: x.vencimento, inicioOp: x.dataOperacao };
          const n = fim === 'sem' ? horizonte(rp, x.vencimento) : fim;
          for (let i = 0; i < n; i++) {
            const venc = proxVenc(x.vencimento, rp, i), op = proxVenc(x.dataOperacao, rp, i);
            await put('dividas', grupo + '-' + i, stamp({ ...x, parcelas: 1, dataOperacao: op, vencimento: venc, numero: `${numBase}-${String(i + 1).padStart(2, '0')}`, cronograma: Eng.gerarCronograma(x.valor, 1, venc), anexos: i === 0 ? novos : [], statusCobranca: 'aberto', cancelada: false, grupo, seq: i, recorrente }, true));
          }
          await audit('criação', 'divida', grupo + '-0', `${numBase}: ${brl(x.valor)} ${FREQS[rp]}${fim === 'sem' ? ', sem data para terminar' : `, ${fim} vezes`} · ${X.dev[x.devedorId]?.nome} · ${x.confirmacao}`);
          S.dirty = false; toast(fim === 'sem' ? 'Dívida recorrente cadastrada.' : `${n} dívidas cadastradas.`); go('devedor', { id: x.devedorId });
        } else {
          const id = newId('dividas');
          const doc = { ...x, numero: x.numero || proxNumero(), cronograma: Eng.gerarCronograma(x.valor, x.parcelas, x.vencimento), anexos: novos, statusCobranca: 'aberto', cancelada: false };
          await put('dividas', id, stamp(doc, true));
          await audit('criação', 'divida', id, `${doc.numero}: ${brl(x.valor)} de ${X.dev[x.devedorId]?.nome} a ${credNome(X.cred[x.credorId])}`);
          S.dirty = false; toast('Dívida cadastrada.'); go('divida', { id });
        }
      }
    } catch (er) { console.error(er); toast(errMsg(er), true); }
    finally { if (btn.isConnected) btn.disabled = false; }
  });
};

/* ---- pagamento ---- */
function previewPag(d, data, valor) {
  const pags = [...(X.pagsBy[d.id] || []), { data, valor, tipo: 'recebimento', criadoEm: '9' }];
  const asOf = data > X.t ? data : X.t;
  const r = Eng.calcular(d, pags, X.ajsBy[d.id] || [], asOf);
  const l = r.ledger.filter(x => x.credito && x.data === data).pop();
  return { r, parts: l ? l.parts : null };
}
function openPagamento(d, tipo = 'recebimento') {
  if (!needWrite()) return;
  const cr = credOf(d), c = X.C[d.id];
  const contas = (cr.contas || []).filter(Boolean);
  const isAb = tipo === 'abatimento';
  const livreAb = c.proxima && c.proxima.venc === SEM;
  const sugest = c.proxima ? Math.min(c.proxima.valor - c.proxima.pago + (c.vencido ? c.jurosAberto + c.multaAberta : 0), c.saldo) : c.saldo;
  const form = openModal({
    title: isAb ? 'Conceder desconto / abatimento' : 'Registrar pagamento', ok: isAb ? 'Registrar abatimento' : 'Registrar pagamento',
    body: `<div class="notice info" style="font-size:13px"><b>${esc(devOf(d).nome)}</b> → ${credTag(cr)} ${esc(credNome(cr))}<br>${esc(divNum(d))} · ${esc(d.descricao)} · saldo hoje <b class="num">${brl(c.saldo)}</b></div>
    ${isAb ? '<div class="hint muted">O abatimento reduz o saldo, mas não conta como valor recebido.</div>' : ''}
    <div class="form">
      <div class="f"><label for="pg-data">Data do pagamento <span class="req">*</span></label><input type="date" id="pg-data" name="data" value="${X.t}" max="${X.t}"></div>
      <div class="f"><label for="pg-valor">Valor ${isAb ? 'do abatimento' : 'recebido'} (R$) <span class="req">*</span></label><input type="text" class="money-in" inputmode="decimal" id="pg-valor" name="valor" placeholder="0,00"><div class="flex">${livreAb ? '' : `<button type="button" class="btn ghost sm" data-fill="${sugest}">${c.parcelas.length > 1 ? 'Próxima parcela' : 'Sugerido'} ${brl(sugest)}</button>`}<button type="button" class="btn ghost sm" data-fill="quitar">Quitar saldo</button></div><span class="hint">Pode ser qualquer valor, antes ou depois do vencimento: o saldo é abatido e o restante continua devido.</span></div>
      ${isAb ? '' : `<div class="f"><label for="pg-forma">Forma de pagamento</label><select id="pg-forma" name="forma">${FORMAS.map(x => `<option ${d.formaPagamento === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
      <div class="f"><label for="pg-conta">Conta de destino</label><select id="pg-conta" name="conta"><option value="">${contas.length ? '—' : 'Nenhuma conta cadastrada para este credor'}</option>${contas.map(x => `<option>${esc(x)}</option>`).join('')}</select></div>`}
      <div class="f full"><label for="pg-obs">${isAb ? 'Motivo do desconto' : 'Observações'}${isAb ? ' <span class="req">*</span>' : ''}</label><input type="text" id="pg-obs" name="obs"></div>
      ${isAb ? '' : fileInput('pg-files', 'Comprovante')}
      <div class="f full" id="pg-prev"></div>
    </div>`,
    onSubmit: async f => {
      const data = fv(f, 'data'), valor = parseBRL(fv(f, 'valor'));
      if (!data) { toast('Informe a data.', true); return false; }
      if (data > X.t) { toast('Não é possível registrar pagamento com data futura. Use "Promessa de pagamento".', true); return false; }
      if (!(valor > 0)) { toast('Informe um valor maior que zero.', true); return false; }
      if (isAb && !fv(f, 'obs')) { toast('Informe o motivo do desconto.', true); return false; }
      const { r } = previewPag(d, data, valor);
      if (r.excedente > 0) { toast(`O valor ultrapassa o saldo em ${brl(r.excedente)}. Máximo nesta data: ${brl(valor - r.excedente)}.`, true); return false; }
      const dup = (X.pagsBy[d.id] || []).find(g => g.data === data && g.valor === valor && g.tipo === tipo);
      if (dup && !f.dataset.dupOk) {
        f.dataset.dupOk = '1';
        toast(`Já existe um pagamento de ${brl(valor)} em ${fd(data)} nesta dívida. Toque de novo em salvar para confirmar que é outro pagamento.`, true);
        return false;
      }
      const anexos = isAb ? [] : await uploadFiles(f.elements.files.files, d.credorId);
      const id = newId('pagamentos');
      await put('pagamentos', id, stamp({ dividaId: d.id, credorId: d.credorId, devedorId: d.devedorId, data, valor, tipo, forma: isAb ? '' : fv(f, 'forma'), conta: isAb ? '' : fv(f, 'conta'), obs: fv(f, 'obs'), anexos, cancelado: false }, true));
      await audit('criação', 'pagamento', id, `${isAb ? 'Abatimento' : 'Recebimento'} de ${brl(valor)} em ${fd(data)} · ${divNum(d)} (${credNome(cr)})`, { dividaId: d.id });
      if (!isAb && d.promessa && d.promessa.data && !d.promessa.cumprida) {
        try { await upd('dividas', d.id, { promessa: { ...d.promessa, cumprida: true }, statusCobranca: d.statusCobranca === 'prometido' ? 'aberto' : d.statusCobranca }); } catch { }
      }
      toast(r.saldo === 0 ? 'Pagamento registrado. Dívida quitada.' : `Pagamento registrado. Saldo: ${brl(r.saldo)}`);
    }
  });
  const upd_ = () => {
    const data = fv(form, 'data'), valor = parseBRL(fv(form, 'valor')), el = $('#pg-prev');
    if (!el) return;
    if (!data || !(valor > 0)) { el.innerHTML = ''; return; }
    const { r, parts } = previewPag(d, data, valor);
    el.innerHTML = r.excedente > 0 ? `<div class="notice crit">Valor acima do saldo em ${brl(r.excedente)}.</div>`
      : `<div class="box" style="font-size:13px">Este pagamento amortiza ${parts ? `<b>${brl(parts.principal)}</b> de principal, <b>${brl(parts.juros)}</b> de juros${parts.multa ? ` e <b>${brl(parts.multa)}</b> de multa` : ''}` : ''}. Saldo após: <b class="num">${brl(r.saldo)}</b>${r.saldo === 0 ? ' · <span class="ok">quita a dívida</span>' : ''}.</div>`;
  };
  form.addEventListener('input', upd_); form.addEventListener('change', upd_);
  form.querySelectorAll('[data-fill]').forEach(b => b.addEventListener('click', () => {
    let v = b.dataset.fill;
    if (v === 'quitar') { const data = fv(form, 'data') || X.t; v = Eng.calcular(d, X.pagsBy[d.id] || [], X.ajsBy[d.id] || [], data).saldo; }
    form.elements.valor.value = toInput(+v); upd_();
  }));
}

      };

/* dívidas recorrentes sem data para terminar: mantém as próximas criadas */
let estendendoDiv = false;
async function estenderDividasRec() {
  if (estendendoDiv || !S.canWrite || !db || !S.ready) return;
  estendendoDiv = true;
  try {
    const grupos = {};
    for (const d of S.dividas) if (d.grupo && d.recorrente && d.recorrente.fim === 'sem') (grupos[d.grupo] ||= []).push(d);
    for (const [g, itens] of Object.entries(grupos)) {
      if (itens.some(d => d.encerra)) continue;
      const ult = itens.reduce((a, b) => (b.seq ?? 0) > (a.seq ?? 0) ? b : a);
      const { freq, inicio, inicioOp } = ult.recorrente;
      const alvo = horizonte(freq, inicio);
      for (let i = (ult.seq ?? 0) + 1; i < alvo; i++) {
        const id = g + '-' + i;
        if (S.dividas.some(d => d.id === id)) continue;
        const venc = proxVenc(inicio, freq, i);
        const base = clean({ ...ult }); delete base.criadoEm; delete base.atualizadoEm; delete base.criadoPor;
        await put('dividas', id, stamp({ ...base, dataOperacao: proxVenc(inicioOp || inicio, freq, i), vencimento: venc, numero: (ult.numero || '').replace(/-\d+$/, '') + '-' + String(i + 1).padStart(2, '0'), cronograma: Eng.gerarCronograma(ult.valor, 1, venc), anexos: [], seq: i, statusCobranca: 'aberto', cancelada: false, promessa: null, juridico: null, historicoVencimentos: [], renegociadaPara: null }, true));
      }
    }
  } catch (e) { console.warn('recorrência dívidas', e); }
  finally { estendendoDiv = false; }
}

/* ================= VENCIMENTOS ================= */
VIEWS.vencimentos = () => {
  const t = X.t;
  const B = { venc: [], hoje: [], d7: [], d15: [], d30: [], fut: [], livre: [] };
  const ab = S.dividas.filter(d => ativa(d) && inCart(d));
  for (const d of ab) for (const p of X.C[d.id].parcelas) {
    if (p.pago >= p.valor) continue;
    if (p.venc === SEM) { B.livre.push({ d, p }); continue; }
    const k = Eng.diff(t, p.venc);
    (k < 0 ? B.venc : k === 0 ? B.hoje : k <= 7 ? B.d7 : k <= 15 ? B.d15 : k <= 30 ? B.d30 : B.fut).push({ d, p });
  }
  for (const k in B) B[k].sort((a, b) => a.p.venc < b.p.venc ? -1 : 1);
  const proms = ab.filter(d => d.promessa && d.promessa.data && !d.promessa.cumprida).sort((a, b) => a.promessa.data < b.promessa.data ? -1 : 1);
  const lim = Eng.addDays(t, -30);
  const quit = S.dividas.filter(d => !d.cancelada && inCart(d) && X.C[d.id].situacao === 'quitada').map(d => ({ d, em: (X.pagsBy[d.id] || []).reduce((m, g) => g.data > m ? g.data : m, '') })).filter(x => x.em >= lim).sort((a, b) => a.em < b.em ? 1 : -1);
  const sec = (k, titulo, vazio, open = true) => { const it = B[k]; const tot = splitTot(it, x => x.p.valor - x.p.pago, x => x.d); return `<section class="sheet"><header><h2>${titulo}</h2><span class="meta">${it.length ? `${it.length} · ${tot}` : ''}</span></header><div class="list">${it.length ? it.slice(0, open ? 100 : 20).map(x => parcRow(x.d, x.p)).join('') : `<div class="empty">${vazio}</div>`}</div></section>`; };
  return `<div class="ph"><div><div class="eyebrow">${esc(cartLabel())}</div><h1>Agenda de vencimentos</h1><div class="sub">Valores de principal das parcelas em aberto. Juros e multas aparecem no saldo de cada dívida.</div></div></div>
  ${carteiraChips()}
  <div class="flex" style="font-size:13px"><span class="pill crit">Vencida</span><span class="pill warn">Vence em até 7 dias / parcialmente paga</span><span class="pill acc">Em dia</span><span class="pill ok">Quitada</span></div>
  ${sec('venc', 'Vencidas', 'Nenhuma parcela vencida.')}
  ${sec('hoje', 'Vencem hoje', 'Nada vence hoje.')}
  <div class="grid2">${sec('d7', 'Próximos 7 dias', 'Nada nos próximos 7 dias.')}${sec('d15', 'De 8 a 15 dias', 'Nada entre 8 e 15 dias.')}</div>
  <div class="grid2">${sec('d30', 'De 16 a 30 dias', 'Nada entre 16 e 30 dias.')}${sec('fut', 'Vencimentos futuros', 'Nenhum vencimento após 30 dias.', false)}</div>
  ${B.livre.length ? sec('livre', 'Sem data de vencimento', '') : ''}
  <div class="grid2">
  <section class="sheet"><header><h2>Promessas de pagamento</h2><span class="meta">não alteram o vencimento</span></header><div class="list">${proms.length ? proms.map(d => `<button class="row ${d.promessa.data < t ? 'stripe-crit' : 'stripe-warn'}" data-act="go" data-v="divida" data-id="${d.id}"><div><div class="t">${esc(devOf(d).nome)}</div><div class="s">Prometido para <b class="num">${fd(d.promessa.data)}</b>${d.promessa.data < t ? ' · <span class="crit">não cumprida</span>' : ''} · ${credTag(credOf(d))} ${esc(credNome(credOf(d)))}</div></div><div class="v">${brl(d.promessa.valor || X.C[d.id].saldo)}<small>${d.promessa.valor ? 'prometido' : 'saldo'}</small></div></button>`).join('') : '<div class="empty">Nenhuma promessa em aberto.</div>'}</div></section>
  <section class="sheet"><header><h2>Quitadas nos últimos 30 dias</h2></header><div class="list">${quit.length ? quit.map(x => `<button class="row stripe-ok" data-act="go" data-v="divida" data-id="${x.d.id}"><div><div class="t">${esc(devOf(x.d).nome)}</div><div class="s"><span class="pill ok">Quitada</span> em ${fd(x.em)} · ${esc(divNum(x.d))}</div></div><div class="v">${brl(X.C[x.d.id].recebido)}<small>recebido</small></div></button>`).join('') : '<div class="empty">Nenhuma quitação recente.</div>'}</div></section>

  const st = Object.fromEntries(base.map(d => [d.id, statusCob(d)]));

  const lista = base.filter(d => fil ? st[d.id] === fil : st[d.id] !== 'quitado').sort((a, b) => X.C[b.id].vencido - X.C[a.id].vencido || X.C[b.id].saldo - X.C[a.id].saldo);

async function restaurar(file) {
  if (!needWrite()) return;
  let j; try { j = JSON.parse(await file.text()); } catch { toast('Arquivo inválido: não é um JSON.', true); return; }
  if (!j || j.app !== 'gestao-contas-a-receber' || !j.dados) { toast('Este arquivo não é um backup deste aplicativo.', true); return; }
  const n = COLS.reduce((s, c) => s + ((j.dados[c] || []).length), 0);
  const ok = await confirmBox('Restaurar backup', `O backup de <b>${fdt(j.exportadoEm)}</b> tem ${n} registros. Registros com o mesmo identificador serão substituídos pela versão do backup; registros que não estão no backup permanecem. Continuar?`, 'Restaurar', true);
  if (!ok) return;
  let feitos = 0, falhas = 0;
  toast('Restaurando…');
  for (const c of COLS) for (const x of (j.dados[c] || [])) {
    if (!x.id || typeof x.id !== 'string') { falhas++; continue; }
    try { await put(c, x.id, clean(x)); feitos++; } catch (e) { falhas++; if (e && (e.code === 'invalid_argument' || e.code === 'quota_exceeded')) { toast(errMsg(e), true); break; } await sleep(300); }
  }
  for (const x of (j.dados.config || [])) if (x.id === 'geral') { try { await put('config', 'geral', clean(x)); } catch { } }
  await audit('restauração', 'backup', 'backup', `Backup de ${fdt(j.exportadoEm)} restaurado: ${feitos} registros${falhas ? `, ${falhas} falhas` : ''}`);
  toast(`Restauração concluída: ${feitos} registros${falhas ? `, ${falhas} com falha` : ''}.`, !!falhas);
}

  if (U) {

    try { const me = await U.me(); if (me && me.name && S.meId) S.names[S.meId] = me.name; } catch { }

}

/* ================= CONTAS A PAGAR (pessoa física) ================= */
const CATS_PAGAR = ['Moradia', 'Condomínio', 'Cartão de crédito', 'Impostos e taxas', 'Escola', 'Saúde', 'Seguros', 'Empréstimo / financiamento', 'Funcionários', 'Contas de consumo', 'Outros'];
const pfCarteiras = () => S.credores.filter(c => c.tipo === 'PF');
function posPagar(cp, t = X.t) {
  const pags = (cp.pagamentos || []).filter(p => !p.estornado);
  const pago = pags.reduce((s, p) => s + p.valor, 0);
  const saldo = Math.max(0, cp.valor - pago);
  const ultimo = pags.reduce((m, p) => p.data > m ? p.data : m, '');
  const st = cp.cancelada ? 'cancelada' : saldo <= 0 ? 'paga' : cp.vencimento < t ? 'vencida' : pago > 0 ? 'parcial' : 'aberta';
  return { pago, saldo, st, ultimo };
}
const ST_PAGAR = { aberta: ['A pagar', 'acc'], parcial: ['Paga em parte', 'warn'], vencida: ['Vencida', 'crit'], paga: ['Paga', 'ok'], cancelada: ['Cancelada', ''] };
const pillPagar = st => `<span class="pill ${ST_PAGAR[st][1]}">${ST_PAGAR[st][0]}</span>`;

function rowPagar({ cp, p }, pfs, noDash) {
  const stripe = p.st === 'vencida' ? 'stripe-crit' : p.st === 'paga' ? 'stripe-ok' : p.st === 'parcial' ? 'stripe-warn' : 'stripe-acc';
  return `<div class="row compact rowpg ${stripe}">
    <button type="button" class="rowpg-main" data-act="verPagar" data-id="${cp.id}">
      <span class="pg-txt"><span class="pg-nome">${esc(cp.favorecido || cp.descricao)}</span>
        <span class="pg-sub"><span class="num ${p.st === 'vencida' ? 'crit' : ''}">${ddmm(cp.vencimento)}</span>${cp.favorecido && cp.descricao ? ` · ${esc(cp.descricao)}` : ''}${cp.parcela && !(noDash && cp.parcela === 'Recorrente') ? ` · ${esc(cp.parcela)}` : ''}${pfs.length > 1 ? ` · ${esc(credNome(X.cred[cp.credorId]))}` : ''}${p.st !== 'aberta' ? ' ' + pillPagar(p.st) : ''}</span></span>
      <span class="v num">${brl(p.st === 'paga' ? cp.valor : p.saldo)}</span></button>
    ${S.canWrite ? `<span class="rowpg-acts">${p.saldo > 0 && !cp.cancelada ? `<button type="button" class="btn ghost sm ok-btn" data-act="pagarConta" data-id="${cp.id}" aria-label="Marcar como paga" title="Marcar pagamento">${IC.check}</button>` : ''}<button type="button" class="btn ghost sm" data-act="editarPagar" data-id="${cp.id}" aria-label="Editar">${IC.edit}</button><button type="button" class="btn ghost sm" style="color:var(--crit)" data-act="cancelarPagar" data-id="${cp.id}" aria-label="Apagar">${IC.trash}</button></span>` : ''}
  </div>`;
}
function resumoPagarDash() {
  const pfs = pfCarteiras();
  if (!pfs.length) return '';
  const t = X.t, lim = Eng.addDays(t, 60);
  const [m0, m1] = monthBounds(t);
  const it = S.contas_pagar.filter(cp => !cp.cancelada && pfs.some(c => c.id === cp.credorId)).map(cp => ({ cp, p: posPagar(cp) })).filter(x => x.p.saldo > 0);
  const venc = it.filter(x => x.p.st === 'vencida');
  const semana = it.filter(x => x.cp.vencimento >= t && x.cp.vencimento <= lim);
  const mes = it.filter(x => x.cp.vencimento >= m0 && x.cp.vencimento <= m1);
  const soma = a => a.reduce((s, x) => s + x.p.saldo, 0);
  const lista = [...venc, ...semana].sort((a, b) => a.cp.vencimento < b.cp.vencimento ? -1 : 1);
  return `<section class="sheet"><header><h2>Contas a pagar</h2><span class="meta">${venc.length ? `<span class="crit">vencidas ${brl(soma(venc))}</span> · ` : ''}próximos 60 dias ${brl(soma(semana))}</span></header>
    <div class="list">${lista.length ? lista.slice(0, 15).map(x => rowPagar(x, pfs, true)).join('') : `<div class="empty">Nada vencido nem vencendo nos próximos 60 dias.</div>`}
    <button class="row compact" data-act="go" data-v="pagar"><span class="t muted" style="font-weight:500">${lista.length > 15 ? `Ver todas (${lista.length})` : 'Abrir contas a pagar'}</span><span class="v muted">›</span></button></div></section>`;
}
VIEWS.pagar = () => {
  const pfs = pfCarteiras();
  if (!pfs.length) return `<div class="ph"><div><h1>Contas a pagar</h1></div></div><div class="notice">Cadastre primeiro a sua pessoa física em Configurações → Pessoa física.</div><div><button class="btn pri" data-act="go" data-v="config">Ir para Configurações</button></div>`;
  const t = X.t;
  const mes = S.p.mes || t.slice(0, 7);
  const [y, m] = mes.split('-').map(Number);
  const m0 = mes + '-01', m1 = mes + '-' + String(new Date(Date.UTC(y, m, 0)).getUTCDate()).padStart(2, '0');
  const todas = S.contas_pagar.filter(cp => !cp.cancelada && pfs.some(c => c.id === cp.credorId));
  const comPos = todas.map(cp => ({ cp, p: posPagar(cp) }));
  const vencidas = comPos.filter(x => x.p.st === 'vencida').sort((a, b) => a.cp.vencimento < b.cp.vencimento ? -1 : 1);
  const doMes = comPos.filter(x => x.cp.vencimento >= m0 && x.cp.vencimento <= m1).sort((a, b) => a.cp.vencimento < b.cp.vencimento ? -1 : a.cp.vencimento > b.cp.vencimento ? 1 : 0);
  const aPagarMes = doMes.reduce((s, x) => s + x.p.saldo, 0);
  const totVenc = vencidas.reduce((s, x) => s + x.p.saldo, 0);
  const lim7 = Eng.addDays(t, 7);
  const prox7 = comPos.filter(x => x.p.saldo > 0 && x.cp.vencimento >= t && x.cp.vencimento <= lim7).reduce((s, x) => s + x.p.saldo, 0);
  let pagoMes = 0;
  for (const cp of todas) for (const pg of (cp.pagamentos || [])) if (!pg.estornado && pg.data >= m0 && pg.data <= m1) pagoMes += pg.valor;
  const ym = (k) => { const d = new Date(Date.UTC(y, m - 1 + k, 1)); return d.toISOString().slice(0, 7); };
  const row = x => rowPagar(x, pfs);
  const kp = (l, v, h, cls = '') => `<div class="kpi"><div class="l">${l}</div><div class="v ${cls}">${v}</div>${h ? `<div class="h">${h}</div>` : ''}</div>`;
  return `<div class="ph"><div><div class="eyebrow">${pfs.length === 1 ? 'Pessoa física · ' + esc(credNome(pfs[0])) : 'Pessoa física'}</div><h1>Contas a pagar</h1><div class="sub">Visível só para você.</div></div>
    ${S.canWrite ? `<div class="acts"><button class="btn pri" data-act="novaPagar">${IC.nova} Nova conta</button></div>` : ''}</div>
  <div class="kpis" style="grid-template-columns:repeat(4,minmax(0,1fr))">
    ${kp('A pagar no mês', brl(aPagarMes), MESES[m - 1] + '/' + y)}
    ${kp('Vencidas', brl(totVenc), vencidas.length ? `${vencidas.length} conta${vencidas.length > 1 ? 's' : ''}` : 'Nada em atraso', totVenc ? 'crit' : '')}
    ${kp('Próximos 7 dias', brl(prox7))}
    ${kp('Pago no mês', brl(pagoMes), '', pagoMes ? 'ok' : '')}
  </div>
  ${vencidas.length ? `<section class="sheet"><header><h2>Vencidas</h2><span class="meta">${brl(totVenc)}</span></header><div class="list">${vencidas.map(row).join('')}</div></section>` : ''}
  <div class="flex" style="justify-content:space-between"><button class="btn sm" data-act="mesPagar" data-m="${ym(-1)}">‹ Mês anterior</button><span class="eyebrow">Próximos 3 meses</span><button class="btn sm" data-act="mesPagar" data-m="${ym(1)}">Próximo mês ›</button></div>
  <div class="meses3">${[0, 1, 2].map(k => {
    const mk = ym(k); const [yy, mm] = mk.split('-').map(Number);
    const a0 = mk + '-01', a1 = mk + '-' + String(new Date(Date.UTC(yy, mm, 0)).getUTCDate()).padStart(2, '0');
    const its = comPos.filter(x => x.cp.vencimento >= a0 && x.cp.vencimento <= a1).sort((a, b) => a.cp.vencimento < b.cp.vencimento ? -1 : a.cp.vencimento > b.cp.vencimento ? 1 : 0);
    const aberto = its.reduce((s, x) => s + x.p.saldo, 0), total = its.reduce((s, x) => s + x.cp.valor, 0);
    return `<section class="sheet"><header><h2 style="text-transform:capitalize">${MESES[mm - 1]} ${yy}</h2><span class="meta">em aberto <b class="num">${brl(aberto)}</b>${total !== aberto ? ` de ${brl(total)}` : ''}</span></header>
      <div class="list">${its.length ? its.map(row).join('') : `<div class="empty">Nenhuma conta neste mês.</div>`}</div></section>`;
  }).join('')}</div>`;
};

    <div class="f" id="cp-rec" hidden><label for="cp-fim">Até quando</label><select id="cp-fim" name="fim"><option value="sem">Sem data para terminar</option>${[2, 3, 4, 5, 6, 8, 10, 12, 18, 24, 36, 48, 60].map(n => `<option value="${n}">${n} vezes</option>`).join('')}</select><span class="hint">Sem data para terminar: as próximas são criadas automaticamente.</span></div>`}
    <div class="f full"><label for="cp-obs">Observações</label><textarea id="cp-obs" name="obs">${esc(cp.obs)}</textarea></div>
    ${fileInput('cp-files', 'Boleto ou documento')}
  </div>`;
}
ACT.novaPagar = () => {
  if (!needWrite()) return;
  const form = openModal({
    title: 'Nova conta a pagar', ok: 'Cadastrar', body: formPagar(),
    onSubmit: async f => {
      const valor = parseBRL(fv(f, 'valor')), venc = fv(f, 'vencimento'), fav = fv(f, 'favorecido');
      const credorId = fv(f, 'credorId');
      if (!fav) { toast('Informe a quem pagar.', true); return false; }
      if (!(valor > 0)) { toast('Informe o valor.', true); return false; }
      if (!venc) { toast('Informe o vencimento.', true); return false; }
      const rec = fv(f, 'freq') !== 'unico';
      const freq = FREQS[fv(f, 'freq')] ? fv(f, 'freq') : 'mensal';
      const fim = rec ? (fv(f, 'fim') === 'sem' ? 'sem' : Math.max(2, parseInt(fv(f, 'fim')) || 2)) : 1;
      const anexos = await uploadFiles(f.elements.files.files, credorId);
      const base = { credorId, favorecido: fav, descricao: fv(f, 'descricao'), valor, categoria: fv(f, 'categoria'), obs: fv(f, 'obs') };
      let n = 1;
      if (!rec) {
        await put('contas_pagar', newId('contas_pagar'), stamp({ ...base, vencimento: venc, anexos, pagamentos: [], cancelada: false }, true));
      } else {
        const grupo = newId('contas_pagar');
        const recorrente = { freq, fim, inicio: venc };
        n = fim === 'sem' ? horizonte(freq, venc) : fim;
        for (let i = 0; i < n; i++) {
          await put('contas_pagar', grupo + '-' + i, stamp({ ...base, vencimento: proxVenc(venc, freq, i), anexos: i === 0 ? anexos : [], pagamentos: [], cancelada: false, grupo, seq: i, recorrente, parcela: fim === 'sem' ? 'Recorrente' : `${i + 1}/${fim}` }, true));
        }
      }
      await audit('criação', 'conta a pagar', 'conta', `${fav}: ${brl(valor)}${rec ? ` · ${FREQS[freq]}${fim === 'sem' ? ', sem data para terminar' : `, ${fim} vezes`}` : ''} · vencimento ${fd(venc)}`, { credorId });
      toast(rec ? (fim === 'sem' ? 'Conta recorrente cadastrada.' : `${n} contas cadastradas.`) : 'Conta cadastrada.');
      S.p.mes = venc.slice(0, 7);
    }
  });
  form.addEventListener('change', () => { const b = form.querySelector('#cp-rec'); if (b) b.hidden = fv(form, 'freq') === 'unico'; });
};

/* recorrência */
const FREQS = { semanal: 'semanal', quinzenal: 'quinzenal', mensal: 'mensal', anual: 'anual' };
const porDia = freq => freq === 'semanal' || freq === 'quinzenal';
function proxVenc(inicio, freq, i) {
  if (freq === 'semanal') return Eng.addDays(inicio, 7 * i);
  if (freq === 'quinzenal') return Eng.addDays(inicio, 15 * i);
  return freq === 'anual' ? Eng.addMonths(inicio, 12 * i) : Eng.addMonths(inicio, i);
}
function horizonte(freq, inicio) {
  const meses = { semanal: 3, quinzenal: 6, mensal: 12, anual: 24 }[freq] || 12;
  const lim = Eng.addMonths(X.t > inicio ? X.t : inicio, meses);
  let n = 1; while (proxVenc(inicio, freq, n) <= lim && n < 400) n++;
  return Math.max(n, { semanal: 4, quinzenal: 4, mensal: 12, anual: 2 }[freq] || 2);
}
function comDia(data, dia) {
  const [y, m] = data.split('-').map(Number);
  const ult = new Date(Date.UTC(y, m, 0)).getUTCDate();
  return data.slice(0, 8) + String(Math.min(+dia, ult)).padStart(2, '0');
}
let estendendo = false;
async function estenderRecorrentes() {
  if (estendendo || !S.canWrite || !db || !S.ready) return;
  estendendo = true;
  try {
    const grupos = {};
    for (const x of S.contas_pagar) if (x.grupo && x.recorrente && x.recorrente.fim === 'sem') (grupos[x.grupo] ||= []).push(x);
    for (const [g, itens] of Object.entries(grupos)) {
      if (itens.some(x => x.encerra)) continue;
      const ult = itens.reduce((a, b) => (b.seq ?? 0) > (a.seq ?? 0) ? b : a);
      const { freq, inicio } = ult.recorrente;
      const alvo = horizonte(freq, inicio);
      for (let i = (ult.seq ?? 0) + 1; i < alvo; i++) {
        const id = g + '-' + i;
        if (S.contas_pagar.some(x => x.id === id)) continue;
        await put('contas_pagar', id, stamp({ credorId: ult.credorId, favorecido: ult.favorecido, descricao: ult.descricao, valor: ult.valor, categoria: ult.categoria, obs: ult.obs, vencimento: porDia(freq) ? Eng.addDays(ult.vencimento, (freq === 'semanal' ? 7 : 15) * (i - (ult.seq ?? 0))) : comDia(proxVenc(inicio, freq, i), ult.vencimento.slice(8, 10)), anexos: [], pagamentos: [], cancelada: false, grupo: g, seq: i, recorrente: ult.recorrente, parcela: 'Recorrente' }, true));
      }
    }
  } catch (e) { console.warn('recorrência', e); }
  finally { estendendo = false; }
}

/* ================= ACERTOS ENTRE SÓCIOS ================= */
/* Cada lançamento: data, quem pagou → quem recebeu, descrição, valor (e centro de custo opcional).
   Cada nome cadastrado pertence a um lado: conta do Marcelo, conta do Fábio, Empresa ou Terceiro.
   O que sai do lado de um sócio conta a favor dele (a empresa passa a dever); o que entra no lado dele conta contra.
   Resultado compensado = saldo Marcelo − saldo Fábio: a empresa deve a diferença a um dos dois. */
const SOCIOS = [['marcelo', 'Marcelo', 'marcelo@grupowqs.com'], ['fabio', 'Fábio', 'fabio@grupowqs.com']];
const LADOS = [['marcelo', 'Conta do Marcelo'], ['fabio', 'Conta do Fábio'], ['empresa', 'Empresa'], ['terceiro', 'Terceiros (clientes, fornecedores, outros)']];
const isSocio = l => l === 'marcelo' || l === 'fabio';
const socioNome = k => (SOCIOS.find(s => s[0] === k) || [, '—'])[1];
const DEST_PADRAO = ['Maracanã', 'Salários', 'Mega Sena', 'Acordos', 'Acerto entre sócios', 'Outros'];
const cfgAc = () => S.cfgAc || {};
function pessoasAc() {
  const c = cfgAc();
  if (c.pessoas && c.pessoas.length) return c.pessoas.map(p => ({ nome: p.nome, lado: p.lado || p.socio || 'terceiro' }));
  return [...SOCIOS.map(([k, n]) => ({ nome: n, lado: k })), ...empresasAc().map(e => ({ nome: credNome(e), lado: 'empresa' }))];
}
const ladoDe = nome => { const n = String(nome || '').trim().toLowerCase(); const p = pessoasAc().find(x => x.nome.toLowerCase() === n); return p ? p.lado : 'terceiro'; };
const destinosAc = () => (cfgAc().destinos && cfgAc().destinos.length) ? cfgAc().destinos : DEST_PADRAO;
const empresasAc = () => S.credores.filter(c => c.tipo === 'PJ' && c.ativo !== false);
/* lançamentos antigos (mov/quem/socio) viram pagou/recebeu */
function normAc(a) {
  if (a.pagou !== undefined || a.recebeu !== undefined) return a;
  const q = a.quem || socioNome(a.socio);
  return a.mov === 'pagou' ? { ...a, pagou: q, ladoPag: a.socio, recebeu: '', ladoRec: '' } : { ...a, pagou: '', ladoPag: '', recebeu: q, ladoRec: a.socio };
}
/* efeito por sócio: + a empresa deve a ele, − abate */
function efeitoAc(a) {
  const e = {};
  if (isSocio(a.ladoPag) && a.ladoPag !== a.ladoRec) e[a.ladoPag] = (e[a.ladoPag] || 0) + a.valor;
  if (isSocio(a.ladoRec) && a.ladoRec !== a.ladoPag) e[a.ladoRec] = (e[a.ladoRec] || 0) - a.valor;
  return e;
}
const fmtLado = (nome, lado) => !nome ? '<span class="muted">—</span>' : esc(nome) + (isSocio(lado) && nome !== socioNome(lado) ? ` <span class="muted">(${socioNome(lado)})</span>` : '');
function socioPadrao() {
  const em = ((typeof Supa !== 'undefined' && Supa.sessao && Supa.sessao()?.user?.email) || '').toLowerCase();
  return (SOCIOS.find(s => s[2] === em) || SOCIOS[0])[0];
}
function posAcertos(empId) {
  const itens = S.acertos.filter(a => a.credorId === empId && !a.cancelado).map(normAc);
  const P = {}; for (const [k] of SOCIOS) P[k] = { cred: 0, deb: 0, saldo: 0 };
  for (const a of itens) for (const [k, v] of Object.entries(efeitoAc(a))) { if (v > 0) P[k].cred += v; else P[k].deb -= v; }
  for (const p of Object.values(P)) p.saldo = p.cred - p.deb;
  const dif = P.marcelo.saldo - P.fabio.saldo;
  return { itens, P, dif, credor: dif > 0 ? 'marcelo' : dif < 0 ? 'fabio' : null, valor: Math.abs(dif) };
}
function empAc() {
  const emps = empresasAc();
  if (!emps.length) return null;
  if (!emps.some(c => c.id === S.p.emp)) S.p.emp = (emps.find(c => /plai/i.test(c.nome || c.razao || '')) || emps[0]).id;
  return X.cred[S.p.emp];
}
const filtraAc = (itens, f) => {
  const q = (f.q || '').toLowerCase();
  return itens.filter(a => (!f.socio || a.ladoPag === f.socio || a.ladoRec === f.socio) && (!f.dest || (a.destino || '') === f.dest) && (!q || [a.descricao, a.obs, a.pagou, a.recebeu, a.destino].some(t => (t || '').toLowerCase().includes(q))));
};

/* ================= E-COMMERCE FLAMENGO · SELLIA ================= */
/* Cada ciclo (documento da coleção 'ecommerce'): período de venda, data prevista de pagamento, taxa da Sellia (%)
   e, por empresa, a venda informada pela Sellia, a venda pelo nosso controle (conferência, opcional) e o recebimento
   confirmado na conta corrente da empresa. A receber = venda − taxa. */
const ECO_PADRAO = { empresas: [], taxa: 15, dias: 2, duracao: 10, gestores: {} };
const gestorEco = e => (cfgEco().gestores || {})[e] || '';
const cfgEco = () => ({ ...ECO_PADRAO, ...(S.cfgEco || {}) });
const ecoCred = () => { const pj = S.credores.filter(c => c.tipo === 'PJ' && c.ativo !== false); return pj.find(c => /plai/i.test(c.nome || c.razao || '')) || pj[0] || null; };
const pctTxt = p => String(+(+p).toFixed(2)).replace('.', ',') + '%';
const parsePct = s => { const n = Number(String(s ?? '').replace('%', '').replace(',', '.').trim()); return isFinite(n) && n >= 0 && n < 100 ? n : NaN; };
const liqEco = (venda, taxa) => Math.round((venda || 0) * (100 - (taxa || 0)) / 100);
function stItemEco(c, it, t = X.t) {
  const esp = liqEco(it.venda, c.taxa);
  if (it.recebido) { const dif = it.recebido.valor - esp; return { esp, dif, st: Math.abs(dif) < 1 ? 'ok' : 'dif' }; }
  return { esp, dif: 0, st: c.pagamento < t ? 'atraso' : 'aguarda' };
}
const ST_ECO = { aguarda: ['Aguardando', 'acc'], atraso: ['Atrasado', 'crit'], ok: ['Recebido', 'ok'], dif: ['Recebido com diferença', 'warn'] };
const pillEco = st => `<span class="pill ${ST_ECO[st][1]}">${ST_ECO[st][0]}</span>`;
function totCicloEco(c) {
  let venda = 0, esp = 0, rec = 0, pend = 0, atraso = false, dif = false;
  for (const it of c.itens || []) { const s = stItemEco(c, it); venda += it.venda || 0; esp += s.esp; if (it.recebido) rec += it.recebido.valor; else pend += s.esp; if (s.st === 'atraso') atraso = true; if (s.st === 'dif') dif = true; }
  const st = pend ? (atraso ? 'atraso' : 'aguarda') : dif ? 'dif' : 'ok';
  return { venda, esp, rec, pend, st };
}
const ciclosEco = () => S.ecommerce.filter(c => !c.cancelado).sort((a, b) => a.ini < b.ini ? 1 : a.ini > b.ini ? -1 : 0);

function ligarFormEco(form) {

function lerFormEco(f, antigo) {
  const x = { ini: fv(f, 'ini'), fim: fv(f, 'fim'), pagamento: fv(f, 'pagamento'), taxa: parsePct(fv(f, 'taxa')), obs: fv(f, 'obs') };
  if (!x.ini || !x.fim) { toast('Informe o período de vendas.', true); return null; }
  if (x.fim < x.ini) { toast('O fim do período é antes do início.', true); return null; }
  if (!x.pagamento) { toast('Informe a data prevista do pagamento.', true); return null; }
  if (isNaN(x.taxa)) { toast('Informe a taxa em % (ex.: 15).', true); return null; }

  });

/* importação da planilha de vendas da Sellia: reconhece as colunas, agrupa por seller e liga cada seller a uma empresa */
const normCab = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const CAMPOS_ECO = [
  ['seller', 'Seller / empresa', true, ['seller name', 'seller', 'nome do seller', 'loja', 'vendedor', 'nome fantasia', 'razao social', 'empresa', 'lojista']],
  ['cnpj', 'CNPJ', false, ['cnpj', 'cnpj seller', 'documento', 'cpf cnpj']],
  ['valor', 'Valor da venda', true, ['valor repassado', 'valor pedido', 'valor total', 'valor da venda', 'total da venda', 'valor venda', 'valor bruto', 'total', 'valor', 'gmv', 'receita', 'preco total', 'subtotal']],
  ['data', 'Data da venda', false, ['data compra', 'data do pedido', 'data da venda', 'data pedido', 'data venda', 'data de criacao', 'data', 'criado em', 'dt pedido']],
  ['status', 'Status do pedido', false, ['status do pedido', 'status pedido', 'status', 'situacao']]
];
const STATUS_FORA = /cancel|devolv|estorn|reembols|recusad|chargeback/i;
function adivinharColEco(cabs, campo, salvo) {
  if (salvo && cabs.includes(salvo)) return salvo;
  const ns = cabs.map(normCab);
  for (const alvo of campo[3]) { const i = ns.indexOf(alvo); if (i >= 0) return cabs[i]; }
  for (const alvo of campo[3]) { const i = ns.findIndex(n => n.includes(alvo)); if (i >= 0) return cabs[i]; }
  return '';
}
function valorCelEco(v) {
  if (v == null || v === '') return NaN;
  if (typeof v === 'number') return Math.round(v * 100);
  return parseBRL(String(v));
}
function dataCelEco(v) {
  if (v == null || v === '') return '';
  if (v instanceof Date && !isNaN(v)) return new Date(v.getTime() - v.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  if (typeof v === 'number' && v > 20000 && v < 80000) return new Date(Date.UTC(1899, 11, 30) + v * 86400000).toISOString().slice(0, 10);
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; }
  return '';
}
async function lerPlanilhaEco(file) {
  await loadScript(LIBS.xlsx);
  const buf = await file.arrayBuffer();
  let wb;
  if (/\.(csv|txt)$/i.test(file.name) || /csv|text\/plain/.test(file.type)) {
    // CSV: tudo como texto (evita 05/10 virar 10 de maio) e acentos em UTF-8 ou Windows-1252
    let txt = new TextDecoder('utf-8').decode(buf);
    if (txt.includes('\uFFFD')) txt = new TextDecoder('windows-1252').decode(buf);
    const l1 = txt.split(/\r?\n/).slice(0, 10).join('\n');
    const FS = (l1.match(/;/g) || []).length > (l1.match(/,/g) || []).length ? ';' : (l1.match(/\t/g) || []).length > (l1.match(/,/g) || []).length ? '\t' : ',';
    wb = XLSX.read(txt.replace(/^\uFEFF/, ''), { type: 'string', raw: true, FS });
  } else wb = XLSX.read(buf, { type: 'array', cellDates: true });
  let melhor = null;
  for (const nome of wb.SheetNames) {
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[nome], { header: 1, raw: true, defval: '' });
    // linha de cabeçalho: a primeira, entre as 20 iniciais, com mais textos preenchidos
    let hi = -1, best = 0;
    for (let i = 0; i < Math.min(20, aoa.length); i++) { const n = aoa[i].filter(c => typeof c === 'string' && c.trim() && isNaN(Number(c))).length; if (n > best) { best = n; hi = i; } }
    if (hi < 0) continue;
    const cabs = aoa[hi].map((c, i) => String(c).trim() || `Coluna ${i + 1}`);
    const linhas = aoa.slice(hi + 1).filter(r => r.some(c => c !== '' && c != null)).map(r => Object.fromEntries(cabs.map((c, i) => [c, r[i]])));
    // preferência: aba de detalhe do repasse da Sellia ("Resumo_repasse"); senão, a de mais linhas
    const pri = /resumo.?repasse/i.test(nome) ? 2 : 0;
    if (!melhor || pri > melhor.pri || (pri === melhor.pri && linhas.length > melhor.linhas.length)) melhor = { aba: nome, cabs, linhas, pri };
  }
  if (!melhor || !melhor.linhas.length) throw new Error('Não encontrei linhas de venda nessa planilha.');
  return melhor;
}
function agruparEco(P, map) {
  const g = {}; let fora = 0, semValor = 0, dMin = '', dMax = '';
  for (const r of P.linhas) {
    if (map.status && STATUS_FORA.test(String(r[map.status] || ''))) { fora++; continue; }
    const v = valorCelEco(r[map.valor]); if (isNaN(v)) { semValor++; continue; }
    const nome = String(r[map.seller] ?? '').trim() || '(sem seller)';
    const cnpj = map.cnpj ? digits(r[map.cnpj]) : '';
    const chave = cnpj || normCab(nome);
    const x = (g[chave] ||= { chave, nome, cnpj, total: 0, n: 0 }); x.total += v; x.n++;
    if (map.data) { const d = dataCelEco(r[map.data]); if (d && d >= '2000-01-01') { if (!dMin || d < dMin) dMin = d; if (!dMax || d > dMax) dMax = d; } }
  }
  return { grupos: Object.values(g).sort((a, b) => b.total - a.total), fora, semValor, dMin, dMax };
}
function adivinharEmpresaEco(gr) {
  const cfg = cfgEco(), al = cfg.aliases || {};
  if (al[gr.chave]) return al[gr.chave];
  if (gr.cnpj && al[gr.cnpj]) return al[gr.cnpj];
  const n = normCab(gr.nome).replace(/\s/g, '');
  return cfg.empresas.find(e => { const k = normCab(e).replace(/\s/g, ''); return k && (n.includes(k) || k.includes(n)); }) || '';
}

function mapearEco(P, file) {
  const cfg = cfgEco(), salvo = cfg.colunas || {};
