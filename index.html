<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Contas a Receber">
<meta name="theme-color" content="#1E3E70">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Gestão de Contas a Receber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: livro-razão — barra lateral fixa (desktop) / barra inferior (celular), conteúdo em folhas sobre papel acinzentado */
:root{
  --bg:#F1F3EF; --surface:#FFFFFF; --sunk:#E8EBE5; --ink:#17201C; --muted:#5D6A63; --line:#D9DED7;
  --accent:#1E3E70; --accent-ink:#FFFFFF; --accent-soft:#E3E9F4;
  --ok:#1B7448; --ok-soft:#E1F1E7; --warn:#A5620A; --warn-soft:#F7ECDA; --crit:#AE3328; --crit-soft:#F6E2DF;
  --legal:#653A93; --legal-soft:#ECE4F5; --shadow:0 1px 2px rgba(20,30,25,.06),0 4px 16px rgba(20,30,25,.05);
  --f-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1312; --surface:#161B1A; --sunk:#1D2321; --ink:#E5EAE6; --muted:#97A39C; --line:#2A3230;
  --accent:#93B2EE; --accent-ink:#0F1A2E; --accent-soft:#1E2A40;
  --ok:#5BC38B; --ok-soft:#173226; --warn:#E2A74E; --warn-soft:#382A14; --crit:#F0796C; --crit-soft:#3B1D1A;
  --legal:#B99CE8; --legal-soft:#2C2240; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1312; --surface:#161B1A; --sunk:#1D2321; --ink:#E5EAE6; --muted:#97A39C; --line:#2A3230;
  --accent:#93B2EE; --accent-ink:#0F1A2E; --accent-soft:#1E2A40;
  --ok:#5BC38B; --ok-soft:#173226; --warn:#E2A74E; --warn-soft:#382A14; --crit:#F0796C; --crit-soft:#3B1D1A;
  --legal:#B99CE8; --legal-soft:#2C2240; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.m,.money{font-family:var(--f-num);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---- casca ---- */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 12px;gap:4px;overflow:auto}
.brand{padding:4px 10px 18px;display:flex;flex-direction:column;gap:2px}
.brand b{font-weight:800;font-size:17px;letter-spacing:-.01em;line-height:1.2}
.brand span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500;text-align:left}
.nav-btn svg{width:18px;height:18px;flex:none}
.nav-btn:hover{background:var(--sunk);color:var(--ink)}
.nav-btn.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav-btn .ct{margin-left:auto;font:600 11px var(--f-num);background:var(--crit-soft);color:var(--crit);padding:1px 6px;border-radius:99px}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:10px}
.main{min-width:0;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.tabbar{display:none}

@media (min-width:861px){.main{padding-left:32px;padding-right:max(32px,env(safe-area-inset-right,0px))}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));padding-top:16px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0;cursor:pointer}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button.on{color:var(--accent);font-weight:700}
  .tabbar .plus span.ic{background:var(--accent);color:var(--accent-ink);border-radius:12px;width:44px;height:30px;display:grid;place-items:center}
}

/* ---- cabeçalho de página ---- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
.ph .sub{color:var(--muted);font-size:14px;margin-top:4px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ---- carteiras ---- */
.carteiras{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--muted);font-weight:500}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}

/* ---- botões ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}

/* ---- indicadores ---- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.kpi .v{font:600 21px/1.2 var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em;overflow-wrap:anywhere}
.kpi .h{font-size:12px;color:var(--muted)}
.kpi.lead{background:var(--accent);color:var(--accent-ink)}
.kpi.lead .l,.kpi.lead .h{color:inherit;opacity:.8}
.kpi .v.crit{color:var(--crit)} .kpi .v.ok{color:var(--ok)} .kpi .v.legal{color:var(--legal)}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important}.kpi .v{font-size:17px}}

/* ---- folhas ---- */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.sheet>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sheet>header h2{margin:0;font-size:15px;font-weight:700}
.sheet>header .meta{font-size:13px;color:var(--muted)}
.sheet .body{padding:16px 18px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:860px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}

/* ---- tabelas ---- */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th.r,td.r,td.m{text-align:right;white-space:nowrap}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunk)}
tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
td .s{display:block;font-size:12px;color:var(--muted)}
.ledger td.m.deb{color:var(--ink)} .ledger td.m.cred{color:var(--ok)}
.ledger td.m.sal{font-weight:600}
.ledger tr.t-juros td,.ledger tr.t-multa td,.ledger tr.t-ajuste td{color:var(--muted)}
.ledger tr.t-juros td.sal,.ledger tr.t-multa td.sal{color:var(--ink)}
.dc{font:600 10px var(--f-num);padding:1px 4px;border-radius:3px;margin-left:4px;vertical-align:1px}
.dc.d{background:var(--sunk);color:var(--muted)} .dc.c{background:var(--ok-soft);color:var(--ok)}

/* ---- pílulas ---- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.legal{background:var(--legal-soft);color:var(--legal)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);text-transform:uppercase;white-space:nowrap}
.tag.pf{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.tag.pj{color:var(--ink)}
.stamp{display:inline-block;font:700 11px var(--f-num);letter-spacing:.14em;color:var(--legal);border:1.5px solid var(--legal);padding:2px 6px;border-radius:3px;transform:rotate(-2deg)}

/* ---- listas ---- */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.row:last-child{border-bottom:0}
.row.compact{padding:8px 18px;gap:10px}
.row.compact .t{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.row.compact .v{font-size:14px}
.row.compact .sm{font-size:12px;font-weight:500}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.dot.crit{background:var(--crit)}
.row:hover{background:var(--sunk)}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .v{text-align:right;font-family:var(--f-num);font-weight:600;white-space:nowrap}
.row .v small{display:block;font:500 12px var(--f-ui);color:var(--muted)}
.row.stripe-crit{box-shadow:inset 3px 0 0 var(--crit)} .row.stripe-warn{box-shadow:inset 3px 0 0 var(--warn)}
.row.stripe-ok{box-shadow:inset 3px 0 0 var(--ok)} .row.stripe-legal{box-shadow:inset 3px 0 0 var(--legal)} .row.stripe-acc{box-shadow:inset 3px 0 0 var(--accent)}
.empty{padding:28px 18px;color:var(--muted);text-align:center;font-size:14px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-size:15px}

/* ---- formulários ---- */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.form .full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>label,.f>.lb{font-size:13px;font-weight:600}
.f>label .req{color:var(--crit)}
.f .hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=date],input[type=email],input[type=tel],input[type=number],input[type=search],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0}
input.money-in{font-family:var(--f-num);text-align:right}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:max-content;max-width:100%}
.seg button{border:0;background:var(--surface);padding:7px 16px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--bg)}
.box{border:1px dashed var(--line);border-radius:var(--r);padding:14px;background:var(--sunk)}
fieldset{border:0;padding:0;margin:0}
.section-title{grid-column:1/-1;margin:8px 0 -4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;border-top:1px solid var(--line);padding-top:16px}
@media (max-width:640px){.form{grid-template-columns:minmax(0,1fr)}}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filters .f{width:auto;flex:1 1 150px}

/* ---- composição do saldo ---- */
.breakdown{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.breakdown>div{padding:12px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.breakdown .l{font-size:12px;color:var(--muted);font-weight:600}
.breakdown .v{font:600 16px var(--f-num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.breakdown .total{background:var(--accent-soft)}
.breakdown .total .v{color:var(--accent);font-size:19px}
@media (max-width:640px){.breakdown{grid-template-columns:repeat(2,minmax(0,1fr))}}

.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;padding:0 10px}
.tabs button{border:0;background:none;padding:11px 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.notice{padding:12px 14px;border-radius:8px;background:var(--warn-soft);color:var(--ink);font-size:14px;border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.notice.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.notice.crit{background:var(--crit-soft);border-color:color-mix(in srgb,var(--crit) 35%,transparent)}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.file a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.tl:last-child{border-bottom:0}
.tl .d{font:500 13px var(--f-num);color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}

/* ---- modal ---- */
.scrim{position:fixed;inset:0;background:rgba(10,15,12,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:14px;width:min(640px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
.modal header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal header h3{margin:0;font-size:17px}
.modal .mb{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
@media (max-width:640px){.scrim{align-items:flex-end;padding:0;padding-top:max(16px,env(safe-area-inset-top,0px))}.modal{border-radius:16px 16px 0 0;width:100%}.modal footer{padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}}
.toasts{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
@media (min-width:861px){.toasts{bottom:24px}}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:var(--shadow);animation:tin .2s ease-out}
.toast.err{background:var(--crit);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
.sheetmenu{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheetmenu button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px;font-weight:600;cursor:pointer;text-align:left}
.sheetmenu svg{width:20px;height:20px;color:var(--accent)}
.muted{color:var(--muted)} .crit{color:var(--crit)} .ok{color:var(--ok)}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
#login{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
</style>

</head>
<body>
<div id="login" hidden></div>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main"><div class="wrap" id="main"><div class="loading">Carregando seus dados…</div></div></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div id="modal-root"></div>
<div class="toasts" id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.9/dist/umd/supabase.js"></script>

<script>
/* ===== MOTOR FINANCEIRO — todos os valores em centavos (inteiros) ===== */
const Eng = (() => {
  const DAY = 86400000;
  const dn = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d) / DAY; };
  const fromDn = n => new Date(n * DAY).toISOString().slice(0, 10);
  const addDays = (s, k) => fromDn(dn(s) + k);
  const addMonths = (s, k) => {
    const [y, m, d] = s.split('-').map(Number);
    const t = new Date(Date.UTC(y, m - 1 + k, 1));

/* modal genérico */
let modalCtx = null;
function openModal({ title, body, ok = 'Salvar', okClass = 'pri', onSubmit, cancel = 'Cancelar', noFoot }) {
  const root = $('#modal-root');
  root.innerHTML = `<div class="scrim" data-scrim><form class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}" novalidate>
    <header><h3>${esc(title)}</h3><button type="button" class="btn ghost sm" data-close aria-label="Fechar">${IC.x}</button></header>
    <div class="mb">${body}</div>
    ${noFoot ? '' : `<footer><button type="button" class="btn" data-close>${esc(cancel)}</button>${onSubmit ? `<button type="submit" class="btn ${okClass}">${esc(ok)}</button>` : ''}</footer>`}
  </form></div>`;
  const form = root.querySelector('form');
  modalCtx = { form };
  root.querySelector('[data-scrim]').addEventListener('mousedown', e => { if (e.target.hasAttribute('data-scrim')) closeModal(); });
  root.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModal));
  form.addEventListener('submit', async e => {
    e.preventDefault(); if (!onSubmit) return;
    const btn = form.querySelector('button[type=submit]');
    if (btn.disabled) return; btn.disabled = true;
    try { const r = await onSubmit(form); if (r !== false) closeModal(); }
    catch (err) { console.error(err); toast(errMsg(err), true); }
    finally { if (btn.isConnected) btn.disabled = false; }
  });
  const first = form.querySelector('.mb input:not([type=hidden]),.mb select,.mb textarea'); if (first) setTimeout(() => first.focus(), 30);
  return form;
}
function closeModal() { $('#modal-root').innerHTML = ''; modalCtx = null; if (S.pending && !S.dirty) { S.pending = false; requestRender(); } }
function confirmBox(title, msg, ok = 'Confirmar', danger = false, extraField) {
  return new Promise(res => {
    let done = false;
    openModal({
      title, ok, okClass: danger ? 'danger-solid' : 'pri',
      body: `<p style="margin:0">${msg}</p>${extraField || ''}`,
      onSubmit: f => { const v = f.querySelector('[name=just]'); if (v && !v.value.trim()) { toast('Informe a justificativa.', true); return false; } done = true; res(v ? v.value.trim() : true); }
    });
    const root = $('#modal-root');
    const obs = new MutationObserver(() => { if (!root.firstChild) { obs.disconnect(); if (!done) res(false); } });
    obs.observe(root, { childList: true });
  });
}

const VIEWS = {}, AFTER = {};

/* ================= DASHBOARD ================= */
VIEWS.painel = () => {
  const f = S.p.f || (S.p.f = { dev: '', de: '', ate: '', sit: '' });

  const ab = base.filter(ativa);
  const sum = (arr, fn) => arr.reduce((s, x) => s + fn(x), 0);
  const isPF = d => credOf(d).tipo === 'PF';
  const total = sum(ab, d => X.C[d.id].saldo);
  const pf = sum(ab.filter(isPF), d => X.C[d.id].saldo);
  const pj = sum(ab.filter(d => !isPF(d)), d => X.C[d.id].saldo);
  const venc = sum(ab, d => X.C[d.id].vencido);
  const aVenc = sum(ab, d => X.C[d.id].aVencer);
  const jur = sum(ab.filter(d => d.juridico && d.juridico.ativo), d => X.C[d.id].saldo);
  const [m0, m1] = monthBounds(t);
  const ids = new Set(base.map(d => d.id));

  let prevMes = 0;

    if (d.juridico && d.juridico.ativo) x.jur = true;
  }
  const quem = Object.entries(devMap).sort((a, b) => b[1].saldo - a[1].saldo);
  const maxS = quem.length ? quem[0][1].saldo : 0;

    <div class="list">${quem.length ? quem.map(([id, x]) => {
      const v = X.dev[id] || { nome: '(devedor removido)' };

        <div class="v">${brl(x.saldo)}</div></button>`;
    }).join('') : `<div class="empty">Ninguém com saldo em aberto nesta seleção.</div>`}</div></section>`;

  const kp = (l, v, h, cls = '', lead) => `<div class="kpi ${lead ? 'lead' : ''}"><div class="l">${l}</div><div class="v ${cls}">${v}</div>${h ? `<div class="h">${h}</div>` : ''}</div>`;
  const vazio = !S.dividas.length;

      ${keys.length ? keys.map(k => `<tr class="click" data-act="cart" data-c="${esc(X.cred[k]?.tipo === 'PF' ? 'PF' : k)}"><td>${credTag(X.cred[k])} ${esc(credNome(X.cred[k]))}</td><td class="m">${grupos[k].n}</td><td class="m ${grupos[k].venc ? 'crit' : ''}">${brl(grupos[k].venc)}</td><td class="m"><b>${brl(grupos[k].saldo)}</b></td></tr>`).join('') : `<tr><td colspan="4" class="muted">Nenhum saldo em aberto.</td></tr>`}

  </div>
  ${porCarteira}`}`;
};

/* conta corrente de um devedor com um credor */
function contaCorrente(devId, credId, ate) {
  const ds = S.dividas.filter(d => d.devedorId === devId && d.credorId === credId && !d.cancelada);
  const ORD = { principal: 0, juros: 1, multa: 2, ajuste: 3 };
  const rows = [];
  let seq = 0;
  for (const d of ds) for (const l of X.C[d.id].ledger) rows.push({ ...l, d, ord: ORD[l.tipo] ?? 4, seq: seq++ });
  rows.sort((a, b) => a.data < b.data ? -1 : a.data > b.data ? 1 : a.ord - b.ord || a.seq - b.seq);
  let s = 0;
  const out = [];
  for (const r of rows) { s += r.debito - r.credito; r.saldo = s; if (!ate || r.data <= ate) out.push(r); }
  return out;
}
function ledgerTable(rows, opts = {}) {
  if (!rows.length) return `<div class="empty">Nenhuma movimentação.</div>`;
  const deb = rows.reduce((s, r) => s + r.debito, 0), cred = rows.reduce((s, r) => s + r.credito, 0);
  return `<div class="tw"><table class="ledger"><thead><tr><th>Data</th><th>Descrição</th><th class="r">Débito</th><th class="r">Crédito</th><th class="r">Saldo</th></tr></thead><tbody>
  ${rows.map(r => `<tr class="t-${r.tipo}${opts.click !== false ? ' click' : ''}" ${opts.click !== false ? `data-act="go" data-v="divida" data-id="${r.d.id}"` : ''}><td class="num" style="white-space:nowrap">${fd(r.data)}</td>
    <td>${esc(r.tipo === 'principal' ? (r.d.origemRenegociacao ? 'Renegociação · nova dívida' : 'Dívida / empréstimo') : r.desc)}<span class="s">${esc(divNum(r.d))}${r.tipo === 'principal' ? ' · ' + esc(r.d.descricao || '') : ''}${r.parts && (r.parts.juros || r.parts.multa) ? ` · amortizou ${brl(r.parts.principal)} principal, ${brl(r.parts.juros)} juros${r.parts.multa ? ', ' + brl(r.parts.multa) + ' multa' : ''}` : ''}</span></td>
    <td class="m deb">${r.debito ? brl(r.debito) : '—'}</td><td class="m cred">${r.credito ? brl(r.credito) : '—'}</td>
    <td class="m sal">${brl(Math.abs(r.saldo))}<span class="dc ${r.saldo >= 0 ? 'd' : 'c'}">${r.saldo >= 0 ? 'D' : 'C'}</span></td></tr>`).join('')}
  </tbody><tfoot><tr><td></td><td>Totais</td><td class="m">${brl(deb)}</td><td class="m">${brl(cred)}</td><td class="m">${brl(deb - cred)}</td></tr></tfoot></table></div>`;
}

async function uploadFiles(files) {
  const list = [...(files || [])];
  if (!list.length) return [];
  if (!AS) { toast('Envio de documentos indisponível para o seu acesso.', true); return []; }
  const out = [];
  for (const f of list) {
    if (f.size > 20 * 1024 * 1024) { toast(`${f.name}: arquivo acima de 20 MB.`, true); continue; }
    try {
      const r = await AS.upload(f);
      out.push({ id: r.id, nome: f.name, tipo: r.contentType || f.type, tam: f.size, em: nowIso(), por: S.meId || null });
    } catch (e) { console.error(e); toast(`${f.name}: tipo de arquivo não aceito ou falha no envio. Use PDF ou imagem.`, true); }
  }
  return out;
}

};
function readDividaForm(f) {
  const valor = parseBRL(fv(f, 'valor'));
  const parcelas = Math.max(1, Math.min(360, parseInt(fv(f, 'parcelas')) || 1));
  const livre = fv(f, 'livre') === '1';
  const jAtivo = fv(f, 'jAtivo') === '1', mAtivo = !livre && fv(f, 'mAtivo') === '1';
  const taxa = Number(fv(f, 'taxa').replace(',', '.'));
  const mpct = Number(fv(f, 'mpct').replace(',', '.'));
  return {
    credorId: f.elements.credorId.value, devedorId: f.elements.devedorId.value, valor, dataOperacao: fv(f, 'dataOperacao'),
    descricao: fv(f, 'descricao'), vencimento: livre ? SEM : fv(f, 'vencimento'), parcelas: livre ? 1 : parcelas, livre, numero: fv(f, 'numero'), categoria: fv(f, 'categoria'),
    formaPagamento: fv(f, 'formaPagamento'), amortizacao: fv(f, 'amortizacao'), obs: fv(f, 'obs'),
    juros: jAtivo ? { ativo: true, taxa, periodo: fv(f, 'periodo'), tipo: fv(f, 'jtipo'), inicio: fv(f, 'inicio') || '' } : { ativo: false },
    multa: mAtivo ? { ativo: true, pct: mpct } : { ativo: false }
  };
}
function validaDivida(x) {
  if (!x.credorId) return 'Selecione o credor.';
  if (!x.devedorId) return 'Selecione o devedor.';
  if (!(x.valor > 0)) return 'Informe um valor original maior que zero.';
  if (!x.dataOperacao) return 'Informe a data da operação.';
  if (!x.descricao) return 'Informe o motivo ou a descrição.';
  if (!x.vencimento) return 'Informe a data prevista para pagamento.';
  if (x.vencimento < x.dataOperacao) return 'O vencimento não pode ser anterior à data da operação.';
  if (x.juros.ativo && !(x.juros.taxa > 0 && x.juros.taxa < 100)) return 'Informe uma taxa de juros válida (ex.: 2 para 2%).';
  if (x.juros.ativo && x.juros.inicio && x.juros.inicio < x.dataOperacao) return 'O início dos juros não pode ser anterior à operação.';
  if (x.multa.ativo && !(x.multa.pct > 0 && x.multa.pct <= 100)) return 'Informe um percentual de multa válido.';
  return null;
}
AFTER.nova = () => {
  const f = $('#f-div'); if (!f) return;
  const prev = () => {
    const x = readDividaForm(f);
    $('#box-juros').hidden = !x.juros.ativo; $('#box-multa').hidden = !x.multa.ativo;
    ['#wrap-venc', '#wrap-parc', '#wrap-multa'].forEach(s => $(s).hidden = x.livre); $('#hint-livre').hidden = !x.livre;
    const el = $('#nd-prev');
    if (x.livre) { el.innerHTML = ''; return; }
    if (!(x.valor > 0) || !x.vencimento) { el.innerHTML = ''; return; }
    const cr = Eng.gerarCronograma(x.valor, x.parcelas, x.vencimento);
    const show = cr.length > 6 ? [...cr.slice(0, 3), null, ...cr.slice(-2)] : cr;
    let simul = '';
    if (x.juros.ativo && x.juros.taxa > 0 && x.dataOperacao && x.vencimento >= x.dataOperacao) {
      const r = Eng.calcular({ ...x, cronograma: cr }, [], [], cr[cr.length - 1].venc);
      simul = `<div class="hint" style="margin-top:6px">Sem pagamentos, os juros até o último vencimento (${fd(cr[cr.length - 1].venc)}) somariam <b class="num">${brl(r.jurosAcumulados)}</b>.</div>`;
    }
    el.innerHTML = `<span class="lb">Cronograma</span><div class="tw"><table><thead><tr><th>Parcela</th><th>Vencimento</th><th class="r">Valor</th></tr></thead><tbody>${show.map(p => p ? `<tr><td>${p.n}/${cr.length}</td><td class="num">${fd(p.venc)}</td><td class="m">${brl(p.valor)}</td></tr>` : `<tr><td colspan="3" class="muted">…</td></tr>`).join('')}</tbody></table></div>${simul}`;
  };
  f.addEventListener('input', prev); f.addEventListener('change', prev); prev();
  f.addEventListener('submit', async e => {
    e.preventDefault();
    if (!needWrite()) return;
    const btn = f.querySelector('button[type=submit]'); if (btn.disabled) return;
    const ed = S.p.editId ? X.div[S.p.editId] : null;
    const x = readDividaForm(f);
    if (ed && (X.pagsBy[ed.id] || []).length) { x.credorId = ed.credorId; x.devedorId = ed.devedorId; }
    const err = validaDivida(x); if (err) { toast(err, true); return; }
    btn.disabled = true;
    try {
      const novos = await uploadFiles(f.elements.files.files);
      if (ed) {
        const mudouCron = ed.valor !== x.valor || (ed.parcelas || 1) !== x.parcelas || ed.vencimento !== x.vencimento;
        const doc = clean({ ...ed, ...x, numero: x.numero || ed.numero, cronograma: mudouCron ? Eng.gerarCronograma(x.valor, x.parcelas, x.vencimento) : ed.cronograma, anexos: [...(ed.anexos || []), ...novos] });
        const campos = ['credorId', 'devedorId', 'valor', 'dataOperacao', 'descricao', 'vencimento', 'parcelas', 'numero', 'categoria', 'formaPagamento', 'amortizacao', 'obs'];
        const diffs = campos.filter(k => String(ed[k] ?? '') !== String(doc[k] ?? '')).map(k => `${k}: ${k === 'valor' ? brl(ed[k]) : (ed[k] ?? '—')} → ${k === 'valor' ? brl(doc[k]) : (doc[k] ?? '—')}`);
        if (JSON.stringify(ed.juros || {}) !== JSON.stringify(x.juros)) diffs.push('condições de juros alteradas');
        if (JSON.stringify(ed.multa || {}) !== JSON.stringify(x.multa)) diffs.push('condições de multa alteradas');
        if (novos.length) diffs.push(`${novos.length} documento(s) anexado(s)`);
        await put('dividas', ed.id, stamp(doc, false));
        await audit('edição', 'divida', ed.id, diffs.length ? diffs.join('; ') : 'Dívida salva sem alterações', { antes: JSON.stringify(clean(ed)).slice(0, 6000) });
        S.dirty = false; toast('Dívida atualizada.'); go('divida', { id: ed.id });
      } else {
        const id = newId('dividas');
        const doc = { ...x, numero: x.numero || proxNumero(), cronograma: Eng.gerarCronograma(x.valor, x.parcelas, x.vencimento), anexos: novos, statusCobranca: 'aberto', cancelada: false };
        await put('dividas', id, stamp(doc, true));
        await audit('criação', 'divida', id, `${doc.numero}: ${brl(x.valor)} de ${X.dev[x.devedorId]?.nome} a ${credNome(X.cred[x.credorId])}`);
        S.dirty = false; toast('Dívida cadastrada.'); go('divida', { id });
      }
    } catch (er) { console.error(er); toast(errMsg(er), true); }
    finally { if (btn.isConnected) btn.disabled = false; }
  });
};

/* ---- pagamento ---- */
function previewPag(d, data, valor) {
  const pags = [...(X.pagsBy[d.id] || []), { data, valor, tipo: 'recebimento', criadoEm: '9' }];
  const asOf = data > X.t ? data : X.t;
  const r = Eng.calcular(d, pags, X.ajsBy[d.id] || [], asOf);
  const l = r.ledger.filter(x => x.credito && x.data === data).pop();
  return { r, parts: l ? l.parts : null };
}
function openPagamento(d, tipo = 'recebimento') {
  if (!needWrite()) return;
  const cr = credOf(d), c = X.C[d.id];
  const contas = (cr.contas || []).filter(Boolean);
  const isAb = tipo === 'abatimento';
  const livreAb = c.proxima && c.proxima.venc === SEM;
  const sugest = c.proxima ? Math.min(c.proxima.valor - c.proxima.pago + (c.vencido ? c.jurosAberto + c.multaAberta : 0), c.saldo) : c.saldo;
  const form = openModal({
    title: isAb ? 'Conceder desconto / abatimento' : 'Registrar pagamento', ok: isAb ? 'Registrar abatimento' : 'Registrar pagamento',
    body: `<div class="notice info" style="font-size:13px"><b>${esc(devOf(d).nome)}</b> → ${credTag(cr)} ${esc(credNome(cr))}<br>${esc(divNum(d))} · ${esc(d.descricao)} · saldo hoje <b class="num">${brl(c.saldo)}</b></div>
    ${isAb ? '<div class="hint muted">O abatimento reduz o saldo, mas não conta como valor recebido.</div>' : ''}
    <div class="form">
      <div class="f"><label for="pg-data">Data do pagamento <span class="req">*</span></label><input type="date" id="pg-data" name="data" value="${X.t}" max="${X.t}"></div>
      <div class="f"><label for="pg-valor">Valor ${isAb ? 'do abatimento' : 'recebido'} (R$) <span class="req">*</span></label><input type="text" class="money-in" inputmode="decimal" id="pg-valor" name="valor" placeholder="0,00"><div class="flex">${livreAb ? '' : `<button type="button" class="btn ghost sm" data-fill="${sugest}">${c.parcelas.length > 1 ? 'Próxima parcela' : 'Sugerido'} ${brl(sugest)}</button>`}<button type="button" class="btn ghost sm" data-fill="quitar">Quitar saldo</button></div><span class="hint">Pode ser qualquer valor, antes ou depois do vencimento: o saldo é abatido e o restante continua devido.</span></div>
      ${isAb ? '' : `<div class="f"><label for="pg-forma">Forma de pagamento</label><select id="pg-forma" name="forma">${FORMAS.map(x => `<option ${d.formaPagamento === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
      <div class="f"><label for="pg-conta">Conta de destino</label><select id="pg-conta" name="conta"><option value="">${contas.length ? '—' : 'Nenhuma conta cadastrada para este credor'}</option>${contas.map(x => `<option>${esc(x)}</option>`).join('')}</select></div>`}
      <div class="f full"><label for="pg-obs">${isAb ? 'Motivo do desconto' : 'Observações'}${isAb ? ' <span class="req">*</span>' : ''}</label><input type="text" id="pg-obs" name="obs"></div>
      ${isAb ? '' : fileInput('pg-files', 'Comprovante')}
      <div class="f full" id="pg-prev"></div>
    </div>`,
    onSubmit: async f => {
      const data = fv(f, 'data'), valor = parseBRL(fv(f, 'valor'));
      if (!data) { toast('Informe a data.', true); return false; }
      if (data > X.t) { toast('Não é possível registrar pagamento com data futura. Use "Promessa de pagamento".', true); return false; }
      if (data < d.dataOperacao) { toast('A data é anterior à operação.', true); return false; }
      if (!(valor > 0)) { toast('Informe um valor maior que zero.', true); return false; }
      if (isAb && !fv(f, 'obs')) { toast('Informe o motivo do desconto.', true); return false; }
      const { r } = previewPag(d, data, valor);
      if (r.excedente > 0) { toast(`O valor ultrapassa o saldo em ${brl(r.excedente)}. Máximo nesta data: ${brl(valor - r.excedente)}.`, true); return false; }
      const dup = (X.pagsBy[d.id] || []).find(g => g.data === data && g.valor === valor && g.tipo === tipo);
      if (dup && !f.dataset.dupOk) {
        f.dataset.dupOk = '1';
        toast(`Já existe um pagamento de ${brl(valor)} em ${fd(data)} nesta dívida. Toque de novo em salvar para confirmar que é outro pagamento.`, true);
        return false;
      }
      const anexos = isAb ? [] : await uploadFiles(f.elements.files.files);
      const id = newId('pagamentos');
      await put('pagamentos', id, stamp({ dividaId: d.id, credorId: d.credorId, devedorId: d.devedorId, data, valor, tipo, forma: isAb ? '' : fv(f, 'forma'), conta: isAb ? '' : fv(f, 'conta'), obs: fv(f, 'obs'), anexos, cancelado: false }, true));
      await audit('criação', 'pagamento', id, `${isAb ? 'Abatimento' : 'Recebimento'} de ${brl(valor)} em ${fd(data)} · ${divNum(d)} (${credNome(cr)})`, { dividaId: d.id });
      if (!isAb && d.promessa && d.promessa.data && !d.promessa.cumprida) {
        try { await upd('dividas', d.id, { promessa: { ...d.promessa, cumprida: true }, statusCobranca: d.statusCobranca === 'prometido' ? 'aberto' : d.statusCobranca }); } catch { }
      }
      toast(r.saldo === 0 ? 'Pagamento registrado. Dívida quitada.' : `Pagamento registrado. Saldo: ${brl(r.saldo)}`);
    }
  });
  const upd_ = () => {
    const data = fv(form, 'data'), valor = parseBRL(fv(form, 'valor')), el = $('#pg-prev');
    if (!el) return;
    if (!data || !(valor > 0)) { el.innerHTML = ''; return; }
    const { r, parts } = previewPag(d, data, valor);
    el.innerHTML = r.excedente > 0 ? `<div class="notice crit">Valor acima do saldo em ${brl(r.excedente)}.</div>`
      : `<div class="box" style="font-size:13px">Este pagamento amortiza ${parts ? `<b>${brl(parts.principal)}</b> de principal, <b>${brl(parts.juros)}</b> de juros${parts.multa ? ` e <b>${brl(parts.multa)}</b> de multa` : ''}` : ''}. Saldo após: <b class="num">${brl(r.saldo)}</b>${r.saldo === 0 ? ' · <span class="ok">quita a dívida</span>' : ''}.</div>`;
  };
  form.addEventListener('input', upd_); form.addEventListener('change', upd_);
  form.querySelectorAll('[data-fill]').forEach(b => b.addEventListener('click', () => {
    let v = b.dataset.fill;
    if (v === 'quitar') { const data = fv(form, 'data') || X.t; v = Eng.calcular(d, X.pagsBy[d.id] || [], X.ajsBy[d.id] || [], data).saldo; }
    form.elements.valor.value = toInput(+v); upd_();
  }));
}

  const form = openModal({
    title: 'Renegociar dívida', ok: 'Confirmar renegociação',
    body: `<div class="notice info" style="font-size:13px">A dívida ${esc(divNum(d))} recebe uma baixa por renegociação (não conta como recebimento) e uma nova dívida é criada com as condições do acordo. Todo o histórico original é mantido.</div>
    <div class="form">
      <div class="f"><label for="rn-data">Data do acordo</label><input type="date" id="rn-data" name="data" value="${X.t}" max="${X.t}"></div>
      <div class="f"><label for="rn-val">Valor acordado (R$) <span class="req">*</span></label><input type="text" class="money-in" inputmode="decimal" id="rn-val" name="valor" value="${toInput(c.saldo)}"><span class="hint" id="rn-saldo">Saldo na data: ${brl(c.saldo)}</span></div>
      <div class="f"><label for="rn-venc">1º vencimento <span class="req">*</span></label><input type="date" id="rn-venc" name="venc"></div>
      <div class="f"><label for="rn-parc">Parcelas</label><input type="number" min="1" max="360" id="rn-parc" name="parcelas" value="1"></div>
      <div class="f"><label for="rn-taxa">Juros (% a.m., opcional)</label><input type="text" inputmode="decimal" id="rn-taxa" name="taxa" placeholder="Sem juros"></div>
      <div class="f"><label for="rn-tipo">Tipo de juros</label><select id="rn-tipo" name="tipo"><option value="simples">Simples</option><option value="composto">Compostos</option></select></div>
      <div class="f"><label for="rn-multa">Multa por atraso (%, opcional)</label><input type="text" inputmode="decimal" id="rn-multa" name="multa" placeholder="Sem multa"></div>
      <div class="f full"><label for="rn-obs">Termos do acordo</label><textarea id="rn-obs" name="obs"></textarea></div>
    </div>`,
    onSubmit: async f => {
      const data = fv(f, 'data'), valor = parseBRL(fv(f, 'valor')), venc = fv(f, 'venc');
      const parcelas = Math.max(1, parseInt(fv(f, 'parcelas')) || 1);
      const taxa = Number(fv(f, 'taxa').replace(',', '.')) || 0, mp = Number(fv(f, 'multa').replace(',', '.')) || 0;
      if (!data || data > X.t || data < d.dataOperacao) { toast('Data do acordo inválida.', true); return false; }
      if (!(valor > 0)) { toast('Informe o valor acordado.', true); return false; }
      if (!venc || venc < data) { toast('Informe o 1º vencimento (igual ou após o acordo).', true); return false; }
      const saldoData = Eng.calcular(d, X.pagsBy[d.id] || [], X.ajsBy[d.id] || [], data).saldo;
      if (saldoData <= 0) { toast('Não há saldo nesta data.', true); return false; }
      const nid = newId('dividas'), pid = newId('pagamentos');
      const nRen = S.dividas.filter(x => x.origemRenegociacao === d.id).length + 1;
      const nova = {
        credorId: d.credorId, devedorId: d.devedorId, valor, dataOperacao: data, descricao: `Renegociação de ${divNum(d)} · ${d.descricao}`, vencimento: venc, parcelas,
        numero: `${divNum(d)}-R${nRen}`, categoria: d.categoria || '', formaPagamento: d.formaPagamento || '', amortizacao: d.amortizacao || 'juros_primeiro', obs: fv(f, 'obs'),
        juros: taxa > 0 ? { ativo: true, taxa, periodo: 'mes', tipo: fv(f, 'tipo'), inicio: '' } : { ativo: false }, multa: mp > 0 ? { ativo: true, pct: mp } : { ativo: false },
        cronograma: Eng.gerarCronograma(valor, parcelas, venc), anexos: [], statusCobranca: 'aberto', cancelada: false, origemRenegociacao: d.id
      };
      await put('dividas', nid, stamp(nova, true));
      await put('pagamentos', pid, stamp({ dividaId: d.id, credorId: d.credorId, devedorId: d.devedorId, data, valor: saldoData, tipo: 'renegociacao', forma: '', conta: '', obs: `Renegociada para ${nova.numero}`, novaDividaId: nid, anexos: [], cancelado: false }, true));
      await upd('dividas', d.id, { renegociadaPara: nid, atualizadoEm: nowIso() });
      await audit('renegociação', 'divida', d.id, `Saldo de ${brl(saldoData)} renegociado em ${fd(data)} para ${nova.numero} (${brl(valor)} em ${parcelas}x)`);
      await audit('criação', 'divida', nid, `${nova.numero} criada por renegociação de ${divNum(d)}`);
      toast('Renegociação registrada.');
      setTimeout(() => go('divida', { id: nid }), 50);
    }
  });
  form.elements.data.addEventListener('change', () => { const v = form.elements.data.value; if (v) $('#rn-saldo').textContent = 'Saldo na data: ' + brl(Eng.calcular(d, X.pagsBy[d.id] || [], X.ajsBy[d.id] || [], v).saldo); });
};

/* ---- cancelar / reativar / anexar / jurídico ---- */
ACT.cancelarDiv = async el => {
  if (!needWrite()) return;
  const d = X.div[el.dataset.id];
  if ((X.pagsBy[d.id] || []).some(g => g.tipo === 'recebimento')) { toast('Esta dívida tem recebimentos. Estorne-os antes de cancelar.', true); return; }
  const j = await confirmBox('Cancelar dívida', `Cancelar <b>${esc(divNum(d))}</b> (${brl(d.valor)})? Ela sai dos saldos, mas o registro e o histórico ficam preservados.`, 'Cancelar dívida', true, justField('Motivo do cancelamento'));
  if (!j) return;
  try { await upd('dividas', d.id, { cancelada: true, canceladaEm: X.t, canceladaPor: S.meId || null, motivoCancelamento: j }); await audit('cancelamento', 'divida', d.id, `Dívida cancelada: ${j}`); toast('Dívida cancelada.'); }
  catch (e) { toast(errMsg(e), true); }
};
ACT.reativar = async el => {
  if (!needWrite()) return;
  const d = X.div[el.dataset.id];
  const ok = await confirmBox('Reativar dívida', `Reativar <b>${esc(divNum(d))}</b>? Ela volta a compor os saldos.`, 'Reativar');
  if (!ok) return;
  try { await upd('dividas', d.id, { cancelada: false, atualizadoEm: nowIso() }); await audit('reativação', 'divida', d.id, 'Dívida reativada'); toast('Dívida reativada.'); }
  catch (e) { toast(errMsg(e), true); }
};
ACT.anexar = el => {
  if (!needWrite()) return;
  const d = X.div[el.dataset.id];
  openModal({
    title: 'Anexar documentos', ok: 'Enviar', body: `<div class="form">${fileInput('ax-files')}</div>`,
    onSubmit: async f => {
      const n = await uploadFiles(f.elements.files.files);
      if (!n.length) { toast('Selecione ao menos um arquivo.', true); return false; }
      await upd('dividas', d.id, { anexos: [...(d.anexos || []), ...n], atualizadoEm: nowIso() });
      await audit('documento', 'divida', d.id, `${n.length} documento(s) anexado(s): ${n.map(x => x.nome).join(', ')}`);
      toast('Documentos anexados.');
    }
  });
};
ACT.juridico = el => {
  if (!needWrite()) return;
  const d = X.div[el.dataset.id], j = d.juridico || {};
  const form = openModal({
    title: j.ativo ? 'Cobrança jurídica' : 'Encaminhar ao jurídico', ok: j.ativo ? 'Salvar' : 'Encaminhar',
    body: `<div class="form">
      <div class="f"><label for="jr-adv">Advogado responsável</label><input type="text" id="jr-adv" name="advogado" value="${esc(j.advogado)}"></div>
      <div class="f"><label for="jr-data">Data de encaminhamento</label><input type="date" id="jr-data" name="dataEnc" value="${j.dataEnc || X.t}"></div>
      <div class="f"><label for="jr-proc">Número do processo</label><input type="text" id="jr-proc" name="processo" value="${esc(j.processo)}" placeholder="0000000-00.0000.0.00.0000"></div>
      <div class="f"><label for="jr-fase">Fase</label><select id="jr-fase" name="fase">${FASES.map(x => `<option ${j.fase === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
      <div class="f"><label for="jr-prox">Próxima providência</label><input type="text" id="jr-prox" name="proxima" value="${esc(j.proxima)}"></div>
      <div class="f"><label for="jr-prazo">Prazo da providência</label><input type="date" id="jr-prazo" name="prazo" value="${j.prazo || ''}"></div>
      <div class="f full"><label for="jr-ac">Acordos realizados</label><textarea id="jr-ac" name="acordos">${esc(j.acordos)}</textarea></div>
      <div class="f full"><label for="jr-obs">Observações</label><textarea id="jr-obs" name="obs">${esc(j.obs)}</textarea></div>
      ${fileInput('jr-files', 'Documentos e contratos')}
      ${j.anexos && j.anexos.length ? `<div class="f full"><span class="lb">Já anexados</span>${fileList(j.anexos)}</div>` : ''}
      ${j.ativo ? `<div class="f full"><button type="button" class="btn danger" id="jr-end">Encerrar acompanhamento jurídico</button></div>` : ''}
    </div>`,
    onSubmit: async f => {
      const n = await uploadFiles(f.elements.files.files);
      const nj = { ...j, ativo: true, advogado: fv(f, 'advogado'), dataEnc: fv(f, 'dataEnc') || X.t, processo: fv(f, 'processo'), fase: fv(f, 'fase'), proxima: fv(f, 'proxima'), prazo: fv(f, 'prazo'), acordos: fv(f, 'acordos'), obs: fv(f, 'obs'), anexos: [...(j.anexos || []), ...n] };
      await upd('dividas', d.id, { juridico: nj, statusCobranca: 'judicial', atualizadoEm: nowIso() });
      await audit('jurídico', 'divida', d.id, j.ativo ? `Dados jurídicos atualizados · fase: ${nj.fase}` : `Encaminhada ao jurídico (${nj.advogado || 'advogado não informado'})`);
      toast(j.ativo ? 'Dados jurídicos salvos.' : 'Dívida encaminhada ao jurídico.');
    }
  });
  const end = form.querySelector('#jr-end');
  if (end) end.addEventListener('click', async () => {
    closeModal();
    const r = await confirmBox('Encerrar jurídico', 'A dívida sai da área jurídica. Os dados ficam no histórico.', 'Encerrar', true, justField('Motivo'));
    if (!r) return;
    try { await upd('dividas', d.id, { juridico: { ...j, ativo: false, encerradoEm: X.t, motivoEncerramento: r }, statusCobranca: 'extrajudicial' }); await audit('jurídico', 'divida', d.id, `Acompanhamento jurídico encerrado: ${r}`); toast('Jurídico encerrado.'); }
    catch (e) { toast(errMsg(e), true); }
  });
};

/* ================= RECEBIMENTOS ================= */
VIEWS.recebimentos = () => {
  const devId = S.p.devedorId || '';
  const f = S.p.rf || (S.p.rf = { de: monthBounds(X.t)[0], ate: X.t });
  const abertasDev = devId ? S.dividas.filter(d => d.devedorId === devId && ativa(d) && inCart(d)) : [];
  const porCred = {};
  for (const d of abertasDev) (porCred[d.credorId] ||= []).push(d);
  const devsComSaldo = new Set(S.dividas.filter(d => ativa(d) && inCart(d)).map(d => d.devedorId));
  const recs = S.pagamentos.filter(g => (!f.de || g.data >= f.de) && (!f.ate || g.data <= f.ate) && X.div[g.dividaId] && inCart(X.div[g.dividaId]))
    .sort((a, b) => (b.data + (b.criadoEm || '')).localeCompare(a.data + (a.criadoEm || '')));
  const tot = recs.filter(g => !g.cancelado && g.tipo === 'recebimento').reduce((s, g) => s + g.valor, 0);
  return `<div class="ph"><div><div class="eyebrow">${esc(cartLabel())}</div><h1>Recebimentos</h1><div class="sub">Escolha o devedor e a dívida. O credor vem da própria dívida, então nenhum valor cai na carteira errada.</div></div></div>
  ${carteiraChips()}
  <section class="sheet"><header><h2>Registrar pagamento</h2></header><div class="body">
    <div class="f" style="max-width:420px"><label for="rc-dev">Devedor</label><select id="rc-dev"><option value="">Selecione…</option>${devOptions(devId, v => devsComSaldo.has(v.id) || v.id === devId)}</select>${devsComSaldo.size ? '' : '<span class="hint">Nenhum devedor com saldo em aberto nesta carteira.</span>'}</div>
  </div>
  ${devId ? (abertasDev.length ? Object.entries(porCred).map(([cid, ds]) => `<div style="border-top:1px solid var(--line)"><div class="body" style="padding-bottom:4px"><span class="eyebrow">${credTag(X.cred[cid])} Credor: ${esc(credNome(X.cred[cid]))}</span></div><div class="list">${ds.map(d => { const c = X.C[d.id]; return `<button class="row ${c.situacao === 'vencida' ? 'stripe-crit' : 'stripe-acc'}" data-act="pagar" data-id="${d.id}"><div><div class="t">${esc(divNum(d))} · ${esc(d.descricao)}</div><div class="s">${sitPill(d)}${c.proxima ? ` próximo vencimento ${fd(c.proxima.venc)}` : ''}</div></div><div class="v">${brl(c.saldo)}<small>receber →</small></div></button>`; }).join('')}</div></div>`).join('') : `<div class="empty">Este devedor não tem dívidas em aberto${S.cart !== 'all' ? ' nesta carteira' : ''}.</div>`) : ''}
  </section>
  <section class="sheet"><header><h2>Recebimentos registrados</h2><span class="meta">Total recebido no período: <b class="num">${brl(tot)}</b></span></header>
    <form class="body filters" id="rc-f"><div class="f"><label for="rc-de">De</label><input type="date" id="rc-de" name="de" value="${f.de}"></div><div class="f"><label for="rc-ate">Até</label><input type="date" id="rc-ate" name="ate" value="${f.ate}"></div></form>
    ${recs.length ? `<div class="tw"><table><thead><tr><th>Data</th><th>Devedor</th><th>Credor</th><th>Dívida</th><th>Forma / conta</th><th class="r">Valor</th><th></th></tr></thead><tbody>
    ${recs.map(g => { const d = X.div[g.dividaId]; return `<tr class="click" data-act="go" data-v="divida" data-id="${g.dividaId}"><td class="num">${fd(g.data)}</td><td>${esc(X.dev[g.devedorId]?.nome || '')}</td><td>${credTag(X.cred[g.credorId])} ${esc(credNome(X.cred[g.credorId]))}</td><td>${esc(divNum(d))}</td><td>${esc([g.forma, g.conta].filter(Boolean).join(' · ') || '—')}${g.anexos && g.anexos.length ? ' ' + IC.clip.replace('<svg', '<svg width="14" height="14"') : ''}</td><td class="m" ${g.cancelado ? 'style="text-decoration:line-through"' : ''}>${brl(g.valor)}</td><td>${g.cancelado ? '<span class="pill">Estornado</span>' : g.tipo === 'recebimento' ? '<span class="pill ok">Recebido</span>' : g.tipo === 'renegociacao' ? '<span class="pill acc">Renegociação</span>' : '<span class="pill">Abatimento</span>'}</td></tr>`; }).join('')}
    </tbody></table></div>` : `<div class="empty">Nenhum recebimento no período.</div>`}
  </section>`;
};
AFTER.recebimentos = () => {
  const s = $('#rc-dev'); if (s) s.addEventListener('change', () => { S.p.devedorId = s.value; render(); });
  const f = $('#rc-f'); if (f) f.addEventListener('change', () => { S.p.rf = { de: fv(f, 'de'), ate: fv(f, 'ate') }; render(); });
};

/* ================= VENCIMENTOS ================= */
VIEWS.vencimentos = () => {
  const t = X.t;
  const B = { venc: [], hoje: [], d7: [], d15: [], d30: [], fut: [], livre: [] };
  const ab = S.dividas.filter(d => ativa(d) && inCart(d));
  for (const d of ab) for (const p of X.C[d.id].parcelas) {
    if (p.pago >= p.valor) continue;
    if (p.venc === SEM) { B.livre.push({ d, p }); continue; }
    const k = Eng.diff(t, p.venc);
    (k < 0 ? B.venc : k === 0 ? B.hoje : k <= 7 ? B.d7 : k <= 15 ? B.d15 : k <= 30 ? B.d30 : B.fut).push({ d, p });
  }
  for (const k in B) B[k].sort((a, b) => a.p.venc < b.p.venc ? -1 : 1);
  const proms = ab.filter(d => d.promessa && d.promessa.data && !d.promessa.cumprida).sort((a, b) => a.promessa.data < b.promessa.data ? -1 : 1);
  const lim = Eng.addDays(t, -30);
  const quit = S.dividas.filter(d => !d.cancelada && inCart(d) && X.C[d.id].situacao === 'quitada').map(d => ({ d, em: (X.pagsBy[d.id] || []).reduce((m, g) => g.data > m ? g.data : m, '') })).filter(x => x.em >= lim).sort((a, b) => a.em < b.em ? 1 : -1);
  const sec = (k, titulo, vazio, open = true) => { const it = B[k]; const tot = it.reduce((s, x) => s + x.p.valor - x.p.pago, 0); return `<section class="sheet"><header><h2>${titulo}</h2><span class="meta">${it.length ? `${it.length} · <b class="num">${brl(tot)}</b>` : ''}</span></header><div class="list">${it.length ? it.slice(0, open ? 100 : 20).map(x => parcRow(x.d, x.p)).join('') : `<div class="empty">${vazio}</div>`}</div></section>`; };
  return `<div class="ph"><div><div class="eyebrow">${esc(cartLabel())}</div><h1>Agenda de vencimentos</h1><div class="sub">Valores de principal das parcelas em aberto. Juros e multas aparecem no saldo de cada dívida.</div></div></div>
  ${carteiraChips()}
  <div class="flex" style="font-size:13px"><span class="pill crit">Vencida</span><span class="pill warn">Vence em até 7 dias / parcialmente paga</span><span class="pill acc">Em dia</span><span class="pill ok">Quitada</span></div>
  ${sec('venc', 'Vencidas', 'Nenhuma parcela vencida.')}
  ${sec('hoje', 'Vencem hoje', 'Nada vence hoje.')}
  <div class="grid2">${sec('d7', 'Próximos 7 dias', 'Nada nos próximos 7 dias.')}${sec('d15', 'De 8 a 15 dias', 'Nada entre 8 e 15 dias.')}</div>
  <div class="grid2">${sec('d30', 'De 16 a 30 dias', 'Nada entre 16 e 30 dias.')}${sec('fut', 'Vencimentos futuros', 'Nenhum vencimento após 30 dias.', false)}</div>
  ${B.livre.length ? sec('livre', 'Sem data de vencimento', '') : ''}
  <div class="grid2">
  <section class="sheet"><header><h2>Promessas de pagamento</h2><span class="meta">não alteram o vencimento</span></header><div class="list">${proms.length ? proms.map(d => `<button class="row ${d.promessa.data < t ? 'stripe-crit' : 'stripe-warn'}" data-act="go" data-v="divida" data-id="${d.id}"><div><div class="t">${esc(devOf(d).nome)}</div><div class="s">Prometido para <b class="num">${fd(d.promessa.data)}</b>${d.promessa.data < t ? ' · <span class="crit">não cumprida</span>' : ''} · ${credTag(credOf(d))} ${esc(credNome(credOf(d)))}</div></div><div class="v">${brl(d.promessa.valor || X.C[d.id].saldo)}<small>${d.promessa.valor ? 'prometido' : 'saldo'}</small></div></button>`).join('') : '<div class="empty">Nenhuma promessa em aberto.</div>'}</div></section>
  <section class="sheet"><header><h2>Quitadas nos últimos 30 dias</h2></header><div class="list">${quit.length ? quit.map(x => `<button class="row stripe-ok" data-act="go" data-v="divida" data-id="${x.d.id}"><div><div class="t">${esc(devOf(x.d).nome)}</div><div class="s"><span class="pill ok">Quitada</span> em ${fd(x.em)} · ${esc(divNum(x.d))}</div></div><div class="v">${brl(X.C[x.d.id].recebido)}<small>recebido</small></div></button>`).join('') : '<div class="empty">Nenhuma quitação recente.</div>'}</div></section>
  </div>`;
};

/* ================= COBRANÇAS ================= */
VIEWS.cobrancas = () => {
  const fil = S.p.st || '';
  const base = S.dividas.filter(d => !d.cancelada && inCart(d));
  const st = Object.fromEntries(base.map(d => [d.id, statusCob(d)]));
  const counts = {}; for (const k of Object.values(st)) counts[k] = (counts[k] || 0) + 1;
  const lista = base.filter(d => fil ? st[d.id] === fil : st[d.id] !== 'quitado').sort((a, b) => X.C[b.id].vencido - X.C[a.id].vencido || X.C[b.id].saldo - X.C[a.id].saldo);
  const ultimo = {};
  for (const c of S.contatos) if (!ultimo[c.dividaId] || (c.data + (c.criadoEm || '')) > (ultimo[c.dividaId].data + (ultimo[c.dividaId].criadoEm || ''))) ultimo[c.dividaId] = c;
  const pend = base.filter(d => ativa(d) && ultimo[d.id] && ultimo[d.id].proximo && ultimo[d.id].proximo <= X.t).sort((a, b) => ultimo[a.id].proximo < ultimo[b.id].proximo ? -1 : 1);
  const semContato = base.filter(d => ativa(d) && X.C[d.id].situacao === 'vencida' && !ultimo[d.id]);
  return `<div class="ph"><div><div class="eyebrow">${esc(cartLabel())}</div><h1>Cobranças</h1><div class="sub">Acompanhamento administrativo de cada dívida, com histórico de contatos.</div></div></div>
  ${carteiraChips()}
  ${pend.length || semContato.length ? `<div class="grid2">
    <section class="sheet"><header><h2>Acompanhamentos para hoje</h2><span class="meta">${pend.length}</span></header><div class="list">${pend.length ? pend.map(d => `<button class="row stripe-warn" data-act="go" data-v="divida" data-id="${d.id}"><div><div class="t">${esc(devOf(d).nome)}</div><div class="s">Retornar em <b class="num">${fd(ultimo[d.id].proximo)}</b> · último: ${esc((ultimo[d.id].descricao || '').slice(0, 60))}</div></div><div class="v">${brl(X.C[d.id].saldo)}</div></button>`).join('') : '<div class="empty">Nenhum retorno agendado para hoje.</div>'}</div></section>
    <section class="sheet"><header><h2>Vencidas sem nenhum contato</h2><span class="meta">${semContato.length}</span></header><div class="list">${semContato.length ? semContato.map(d => divRow(d, 'atraso')).join('') : '<div class="empty">Todas as vencidas já têm contato registrado.</div>'}</div></section>

  const ok = await confirmBox('Restaurar backup', `O backup de <b>${fdt(j.exportadoEm)}</b> tem ${n} registros. Registros com o mesmo identificador serão substituídos pela versão do backup; registros que não estão no backup permanecem. Continuar?`, 'Restaurar', true);

  toast('Restaurando…');
  for (const c of COLS) for (const x of (j.dados[c] || [])) {

  }
  for (const x of (j.dados.config || [])) if (x.id === 'geral') { try { await put('config', 'geral', clean(x)); } catch { } }

/* ================= CONEXÃO SUPABASE (substitui o banco do Claude) ================= */
const CFG_OK = !/COLE_AQUI/.test(SUPABASE_URL + SUPABASE_KEY);
const SB = CFG_OK ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }) : null;
const Supa = (() => {
  const cache = {};            // colecao -> Map(id -> data)
  const listeners = new Set();
  let perfil = null, sessao = null;
  const colOf = c => (cache[c] ||= new Map());
  const genId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()).replace(/-/g, '').slice(0, 20);
  const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
  const merge = (a, b) => { const r = { ...(a || {}) }; for (const [k, v] of Object.entries(b)) r[k] = isObj(v) && isObj(r[k]) ? merge(r[k], v) : v; return r; };
  const mapErr = e => {
    const m = (e && (e.message || e.details || '')) + '';
    const code = e && e.code;
    if (code === '42501' || /row-level security|permission/i.test(m)) return { code: 'invalid_argument', message: m };
    if (/fetch|network|Failed|timeout/i.test(m)) return { code: 'unavailable', message: m };
    return { code: 'unknown', message: m };
  };
  const notify = col => { for (const l of listeners) if (l.col === col) l.emit(); };

  async function carregarTudo() {
    for (const k of Object.keys(cache)) cache[k].clear();
    let from = 0;
    for (;;) {
      const { data, error } = await SB.from('registros').select('colecao,id,data').range(from, from + 999);
      if (error) throw mapErr(error);
      for (const r of data) colOf(r.colecao).set(r.id, r.data);
      if (data.length < 1000) break;
      from += 1000;
    }
    for (const l of listeners) l.emit();
  }
  function tempoReal() {
    SB.channel('registros-mudancas').on('postgres_changes', { event: '*', schema: 'public', table: 'registros' }, p => {
      if (p.eventType === 'DELETE') { const o = p.old || {}; if (o.colecao && o.id) { colOf(o.colecao).delete(o.id); notify(o.colecao); } return; }
      const r = p.new; if (!r || !r.colecao) return;
      colOf(r.colecao).set(r.id, r.data); notify(r.colecao);
    }).subscribe();
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') carregarTudo().catch(() => { }); });
  }

  function docRef(col, id) {
    return {
      id, path: col + '/' + id,
      async get() { const d = colOf(col).get(id); return { id, exists: !!d, data: () => d }; },
      async set(data) {
        const clean = JSON.parse(JSON.stringify(data));
        const { error } = await SB.from('registros').upsert({ colecao: col, id, data: clean, atualizado_em: new Date().toISOString(), atualizado_por: sessao?.user?.id || null });
        if (error) throw mapErr(error);
        colOf(col).set(id, clean); notify(col);
      },
      async update(data) {
        let cur = colOf(col).get(id);
        if (!cur) { const { data: r } = await SB.from('registros').select('data').eq('colecao', col).eq('id', id).maybeSingle(); cur = r && r.data; }
        if (!cur) throw { code: 'invalid_argument', message: 'documento inexistente' };
        await this.set(merge(cur, JSON.parse(JSON.stringify(data))));
      },
      async delete() {
        const { error } = await SB.from('registros').delete().eq('colecao', col).eq('id', id);
        if (error) throw mapErr(error);
        colOf(col).delete(id); notify(col);
      },
      onSnapshot(next) {
        const l = { col, emit: () => { const d = colOf(col).get(id); next({ id, exists: !!d, data: () => d, metadata: {} }); } };
        listeners.add(l); setTimeout(l.emit, 0); return () => listeners.delete(l);
      },
      collection(sub) { return collRef(col + '/' + id + '/' + sub); }
    };
  }
  function collRef(col, opts = {}) {
    const q = {
      path: col,
      doc: id => docRef(col, id || genId()),
      orderBy: (f, dir = 'asc') => collRef(col, { ...opts, f, dir }),
      limit: n => collRef(col, { ...opts, n }),
      where: () => q,
      async add(data) { const r = docRef(col, genId()); await r.set(data); return r; },
      _docs() {
        let arr = [...colOf(col).entries()].map(([id, d]) => ({ id, exists: true, data: () => d }));
        if (opts.f) arr.sort((a, b) => { const x = a.data()[opts.f] ?? '', y = b.data()[opts.f] ?? ''; return (x < y ? -1 : x > y ? 1 : 0) * (opts.dir === 'desc' ? -1 : 1); });
        if (opts.n) arr = arr.slice(0, opts.n);
        return arr;
      },
      async get() { const docs = q._docs(); return { docs, size: docs.length, empty: !docs.length }; },
      onSnapshot(next) {
        const l = { col, emit: () => { const docs = q._docs(); next({ docs, size: docs.length, empty: !docs.length, metadata: {}, docChanges: () => [] }); } };
        listeners.add(l); setTimeout(l.emit, 0); return () => listeners.delete(l);
      }
    };
    return q;
  }
  const db = {
    collection: p => collRef(p),
    doc: p => { const i = p.lastIndexOf('/'); return docRef(p.slice(0, i), p.slice(i + 1)); }
  };
  const user = {
    id: async () => sessao?.user?.id || null,
    isOwner: async () => perfil?.papel === 'editor',
    canEdit: async () => perfil?.papel === 'editor',
    can: async () => perfil?.papel === 'editor',
    me: async () => ({ id: sessao?.user?.id || null, name: perfil?.nome || sessao?.user?.email || '', email: sessao?.user?.email || '' }),
    profiles: async ids => {
      const out = {}; for (const i of ids) out[i] = { id: i, name: '' };
      try { const { data } = await SB.from('usuarios').select('user_id,nome,email').in('user_id', ids); for (const r of data || []) out[r.user_id] = { id: r.user_id, name: r.nome || r.email }; } catch { }
      return out;
    }
  };
  const assets = {
    async upload(file) {
      const nome = file.name.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w.\-]+/g, '_').slice(-80);
      const path = `${new Date().getFullYear()}/${genId()}-${nome}`;
      const { error } = await SB.storage.from('anexos').upload(path, file, { contentType: file.type || 'application/octet-stream', upsert: false });
      if (error) throw mapErr(error);
      return { id: path, url: '', contentType: file.type, sizeBytes: file.size };
    },
    async signedUrl(path) { const { data, error } = await SB.storage.from('anexos').createSignedUrl(path, 600); if (error) throw mapErr(error); return data.signedUrl; }
  };
  const downloads = {
    async save({ filename, data }) {
      const blob = data instanceof Blob ? data : new Blob([data]);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      return { status: 'saved' };
    }
  };
  async function entrar(s) {
    sessao = s;
    const { data, error } = await SB.rpc('meu_perfil');
    if (error) throw mapErr(error);
    perfil = Array.isArray(data) ? data[0] : data;
    if (!perfil) return false;
    await carregarTudo();
    tempoReal();
    window.claude = { use: async n => ({ db, user, assets, downloads }[n] || null) };
    return true;
  }
  return { entrar, assets, perfil: () => perfil, sessao: () => sessao };
})();

/* ================= TELA DE LOGIN ================= */
function telaLogin(modo = 'entrar', msg = '') {
  document.body.classList.add('auth');
  const box = $('#login');
  box.hidden = false; document.querySelector('.app').hidden = true;
  const titulo = { entrar: 'Entrar', esqueci: 'Recuperar senha', nova: 'Criar nova senha' }[modo];
  box.innerHTML = `<form class="login-card" id="f-login" novalidate>
    <div class="brand" style="padding:0 0 8px"><span>Livro de recebíveis</span><b>Gestão de Contas a Receber</b></div>
    <h1 style="margin:0;font-size:20px">${titulo}</h1>
    ${msg ? `<div class="notice ${/erro|inválid|não/i.test(msg) ? 'crit' : 'info'}">${esc(msg)}</div>` : ''}
    ${!CFG_OK ? `<div class="notice crit">Configuração pendente: cole a URL e a chave do Supabase no início do arquivo index.html.</div>` : ''}
    ${modo !== 'nova' ? `<div class="f"><label for="lg-email">E-mail</label><input type="email" id="lg-email" name="email" autocomplete="username" required></div>` : ''}
    ${modo !== 'esqueci' ? `<div class="f"><label for="lg-senha">${modo === 'nova' ? 'Nova senha (mínimo 8 caracteres)' : 'Senha'}</label><input type="password" id="lg-senha" name="senha" autocomplete="${modo === 'nova' ? 'new-password' : 'current-password'}" required></div>` : ''}
    <button type="submit" class="btn pri" ${CFG_OK ? '' : 'disabled'}>${modo === 'entrar' ? 'Entrar' : modo === 'esqueci' ? 'Enviar link por e-mail' : 'Salvar nova senha'}</button>
    ${modo === 'entrar' ? `<button type="button" class="btn ghost" data-modo="esqueci">Esqueci minha senha</button>` : modo === 'esqueci' ? `<button type="button" class="btn ghost" data-modo="entrar">Voltar</button>` : ''}
  </form>`;
  box.querySelectorAll('[data-modo]').forEach(b => b.addEventListener('click', () => telaLogin(b.dataset.modo)));
  const f = $('#f-login');
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
    try {
      if (modo === 'entrar') {
        const { data, error } = await SB.auth.signInWithPassword({ email: fv(f, 'email'), password: f.elements.senha.value });
        if (error) { telaLogin('entrar', 'E-mail ou senha inválidos.'); return; }
        await abrirApp(data.session);
      } else if (modo === 'esqueci') {
        const { error } = await SB.auth.resetPasswordForEmail(fv(f, 'email'), { redirectTo: location.origin + location.pathname });
        telaLogin('entrar', error ? 'Não foi possível enviar o e-mail. Tente de novo em instantes.' : 'Se o e-mail estiver cadastrado, você receberá um link para criar a nova senha.');
      } else {
        const s = f.elements.senha.value;
        if (s.length < 8) { telaLogin('nova', 'A senha precisa ter pelo menos 8 caracteres.'); return; }
        const { error } = await SB.auth.updateUser({ password: s });
        if (error) { telaLogin('nova', 'Não foi possível salvar a senha: ' + error.message); return; }
        const { data } = await SB.auth.getSession();
        await abrirApp(data.session);
      }
    } catch (er) { console.error(er); telaLogin(modo, 'Erro de conexão. Verifique a internet e tente de novo.'); }
    finally { if (btn.isConnected) btn.disabled = false; }
  });
  const first = f.querySelector('input'); if (first) setTimeout(() => first.focus(), 30);
}
async function abrirApp(session) {
  $('#login').innerHTML = '<div class="loading">Carregando seus dados…</div>';
  let ok = false;
  try { ok = await Supa.entrar(session); } catch (e) { console.error(e); telaLogin('entrar', 'Erro ao carregar os dados: ' + (e.message || 'conexão')); return; }
  if (!ok) { await SB.auth.signOut(); telaLogin('entrar', 'Seu e-mail não está autorizado neste sistema. Peça acesso ao administrador.'); return; }
  document.body.classList.remove('auth');
  $('#login').hidden = true; document.querySelector('.app').hidden = false;
  boot();
}
ACT.sair = async () => { const ok = await confirmBox('Sair', 'Encerrar a sessão neste aparelho?', 'Sair'); if (!ok) return; await SB.auth.signOut(); location.reload(); };
ACT.abrirAnexo = async el => {
  const w = window.open('', '_blank');
  try { const u = await Supa.assets.signedUrl(el.dataset.path); if (w) w.location = u; else location.href = u; }
  catch (e) { if (w) w.close(); toast('Não foi possível abrir o documento.', true); }
};
async function iniciar() {
  if (!CFG_OK) { telaLogin(); return; }
  let recovery = /type=recovery/.test(location.hash);
  SB.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') { recovery = true; telaLogin('nova'); } });
  const { data } = await SB.auth.getSession();
  if (recovery) { telaLogin('nova'); return; }
  if (data.session) await abrirApp(data.session); else telaLogin();
}
iniciar();
